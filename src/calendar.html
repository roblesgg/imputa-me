<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width:100%;height:100%; }
  body { border-radius:var(--radius);overflow:hidden; }

  /* Alto de cada hora. Lo fija el JS con el valor real de ROW_H (ver más abajo); esto es
     solo el valor por defecto hasta que lo haga. CSS y JS deben usar SIEMPRE el mismo,
     porque si no las etiquetas de horas y la rejilla se desalinean de los bloques. */
  :root { --row-h: 96px; }

  /* padding-top: deja una franja limpia arriba para el asa de arrastre. En las demás
     ventanas el asa cae sobre el padding vacío del contenedor y funciona; aquí caía
     encima de la barra de título y el solape de zonas drag/no-drag la anulaba. */
  .cal-app { width:100%;height:100%;display:flex;flex-direction:column;position:relative;padding-top:22px;-webkit-app-region:no-drag; }

  /* Barra de título arrastrable: permite mover la ventana desde CUALQUIER punto
     de esta franja superior, no solo desde el texto. Lo marcamos explícitamente
     (y también la fila de navegación de semana) para que toda la parte superior
     de la ventana sirva para arrastrar. */
  .cal-titlebar {
    flex-shrink:0;height:42px;display:flex;align-items:center;gap:10px;
    padding:0 16px;border-bottom:1px solid var(--border);
  }
  /* El contenedor es no-drag; el arrastre va SOLO en el título (izquierda) y en la fila
     de semana, para que la X (arriba a la derecha) se pulse entera. Una zona drag detrás
     del botón no-drag se come parte del clic. */
  .cal-titlebar-title { font-size:14px;font-weight:700;-webkit-app-region:drag; }
  .week-nav { -webkit-app-region:drag; }
  .week-nav .week-nav-btn { -webkit-app-region:no-drag; }
  .cal-titlebar-title .brand-dot { color:var(--accent); }

  .cal-body { flex:1;display:flex;min-height:0;position:relative; }

  /* Sidebar */
  .sidebar {
    width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;
    padding:16px;border-right:1px solid var(--border);overflow-y:auto;
  }


  .mini-cal-nav { display:flex;align-items:center;justify-content:space-between;margin-bottom:6px; }
  .mini-cal-title { font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em; }
  .mini-cal-arrows { display:flex;gap:2px; }
  .mini-nav-btn { background:transparent;border:none;color:var(--text2);width:22px;height:22px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
  .mini-nav-btn:hover { background:var(--bg3);color:var(--text); }

  .mini-cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:2px; }
  .mini-dow { text-align:center;font-size:11px;color:var(--text2);padding:2px 0; }
  .mini-day {
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--text);position:relative;
    -webkit-app-region:no-drag;
  }
  .mini-day:hover { background:var(--bg3); }
  .mini-day.other-month { color:var(--text2);opacity:.35; }
  .mini-day.in-week { background:color-mix(in srgb, var(--accent2) 18%, transparent); }
  .mini-day.today { color:var(--accent);font-weight:700; }
  .mini-day.selected { background:var(--accent2);color:#fff;font-weight:700; }
  .mini-day .dot { position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent); }

  .today-btn {
    background:var(--bg2);border:1px solid var(--border);color:var(--text);
    font-size:13px;padding:8px 0;border-radius:var(--radius-sm);cursor:pointer;
  }
  .today-btn:hover { background:var(--bg3); }

  .legend-title { font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px; }
  .legend-item { display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13.5px;cursor:pointer;border-radius:6px;-webkit-app-region:no-drag; }
  .legend-item:hover { background:var(--bg3); }
  .legend-item.hidden-task { opacity:.4; }
  .legend-item.active-task { background:rgba(52,211,153,.10); }
  .legend-dot {
    width:10px;height:10px;border-radius:50%;flex-shrink:0;cursor:pointer;
    transition:transform .14s, box-shadow .14s;
  }
  .legend-dot:hover { transform:scale(1.5);box-shadow:0 0 0 3px color-mix(in srgb, var(--text) 14%, transparent); }
  .legend-name { flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .legend-deleted-tag { font-size:10.5px;color:var(--text2);font-style:italic; }
  .legend-live-dot { width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;animation:legendPulse 1.4s ease-in-out infinite; }
  @keyframes legendPulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Controles rápidos dentro del popup de editar entrada (pausar / reiniciar con nota /
     reanudar una entrada ya cerrada): ver #popupQuickActions más abajo. Botones tipo
     "píldora" con icono y color según lo que hacen (rojo=parar, verde=arrancar,
     morado=variantes con nota), a juego con el resto de acentos de color de la app. */
  .popup-quick-actions {
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    background:var(--bg2);border:1px solid var(--border);border-radius:10px;
    padding:10px;-webkit-app-region:no-drag;
  }
  .popup-quick-actions:empty { display:none; }
  .popup-quick-actions .pqa-label { width:100%;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em; }
  .pqa-btn {
    display:inline-flex;align-items:center;gap:6px;border-radius:20px;
    padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid transparent;
    cursor:pointer;-webkit-app-region:no-drag;transition:all .15s;
  }
  .pqa-btn svg { flex-shrink:0; }
  .pqa-btn.pqa-danger { background:rgba(248,113,113,.15);color:var(--danger);border-color:rgba(248,113,113,.3); }
  .pqa-btn.pqa-danger:hover { background:rgba(248,113,113,.28); }
  .pqa-btn.pqa-success { background:rgba(52,211,153,.15);color:var(--success);border-color:rgba(52,211,153,.3); }
  .pqa-btn.pqa-success:hover { background:rgba(52,211,153,.28); }
  .pqa-btn.pqa-accent { background:color-mix(in srgb, var(--accent2) 18%, transparent);color:var(--accent);border-color:color-mix(in srgb, var(--accent2) 34%, transparent); }
  .pqa-btn.pqa-accent:hover { background:color-mix(in srgb, var(--accent2) 30%, transparent); }

  /* Popup de confirmación con el estilo de la app (en vez del confirm() nativo de Windows).
     Va encima del popup de editar entrada, que se queda debajo (mismo z-index+1). */
  .confirm-backdrop { z-index:51; }
  .confirm-popup { width:340px;z-index:52; }
  .confirm-popup-text { font-size:13px;color:var(--text2);line-height:1.45; }

  .day-totals { display:flex;flex-direction:column;gap:2px;flex-shrink:0; }
  .totals-sum {
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:5px;padding:6px 8px 2px;border-top:1px solid var(--border);
    font-size:11.5px;font-weight:700;color:var(--text2);
  }
  .day-total-time { font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0; }

  .sidebar-footer { margin-top:auto;display:flex;flex-direction:column;gap:8px; }
  .impute-btn {
    background:color-mix(in srgb, var(--accent2) 22%, transparent) !important;
    border-color:color-mix(in srgb, var(--accent) 42%, transparent) !important;
    color:var(--text) !important;
  }
  .impute-btn:hover { background:color-mix(in srgb, var(--accent2) 34%, transparent) !important; }
  .empezar-btn {
    background:color-mix(in srgb, var(--success) 20%, transparent) !important;
    border-color:color-mix(in srgb, var(--success) 45%, transparent) !important;
    color:var(--text) !important;
  }
  .empezar-btn:hover { background:color-mix(in srgb, var(--success) 32%, transparent) !important; }

  /* Popup de "Empezar tarea": la lista con buscador y el bloque de crear una nueva. */
  .emp-aviso {
    font-size:11.5px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;line-height:1.4;
  }
  .emp-lista {
    display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto;
    border:1px solid var(--border);border-radius:10px;padding:5px;
  }
  .emp-item {
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;
    text-align:left;cursor:pointer;width:100%;
  }
  .emp-item:hover { background:var(--bg3); }
  .emp-item.activa { background:color-mix(in srgb, var(--accent2) 20%, transparent); }
  .emp-dot { width:9px;height:9px;border-radius:50%;flex-shrink:0; }
  .emp-nombre { flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  /* Las subtareas suelen tener nombres largos y aquí sobra alto: se parten en dos
     líneas en vez de cortarse. */
  .emp-sub .emp-nombre { white-space:normal;overflow-wrap:anywhere;line-height:1.3; }
  .emp-sec { font-size:11px;color:var(--text2);flex-shrink:0; }
  .emp-sep { height:1px;background:var(--border);margin:5px 4px; }
  .emp-nueva { display:flex;flex-direction:column;gap:8px; }
  .emp-fila { display:flex;align-items:center;gap:2px; }
  .emp-fila .emp-item { flex:1;min-width:0; }
  .emp-chevron {
    width:26px;height:26px;flex-shrink:0;border:none;background:transparent;color:var(--text2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:7px;
    transition:transform .16s ease,color .12s,background .12s;
  }
  .emp-chevron:hover { color:var(--text);background:var(--bg3); }
  .emp-chevron.abierta { transform:rotate(90deg); }
  .emp-subs {
    display:flex;flex-direction:column;gap:2px;
    margin:2px 0 5px 26px;padding-left:10px;border-left:1.5px solid var(--border);
  }
  .emp-sub {
    display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;
    background:transparent;border:none;color:var(--text);font-family:inherit;font-size:12.5px;
    text-align:left;cursor:pointer;width:100%;
  }
  .emp-sub:hover { background:var(--bg3); }
  .emp-sub.nueva { color:var(--text2);border:1px dashed var(--border); }
  .emp-sub.nueva:hover { color:var(--text);border-color:var(--accent);border-style:solid; }
  .emp-sub-bullet { width:5px;height:5px;border-radius:50%;background:var(--text2);opacity:.55;flex-shrink:0; }
  .emp-sub-t { font-size:11px;color:var(--text2);flex-shrink:0;font-variant-numeric:tabular-nums; }
  .export-btn { width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:13px;padding:9px 0;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px; }
  .export-btn:hover { background:var(--bg3); }

  /* Main */
  .main { flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0; }

  .week-nav { display:flex;align-items:center;gap:10px;padding:14px 20px 8px; }
  .week-nav-btn { background:var(--bg2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
  .week-nav-btn:hover { background:var(--bg3); }
  .week-days-btn {
    display:flex;align-items:center;gap:6px;padding:0 11px;height:28px;border-radius:8px;
    background:var(--bg2);border:1px solid var(--border);color:var(--text2);
    font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    -webkit-app-region:no-drag;transition:background .12s,color .12s,border-color .12s;
  }
  .week-days-btn:hover { background:var(--bg3);color:var(--text); }
  .week-days-btn.con-excepcion {
    border-color:color-mix(in srgb, var(--accent) 55%, transparent);
    color:var(--accent);
  }
  .week-label { font-size:16px;font-weight:600;text-transform:capitalize; }

  .week-header { display:flex;padding:0 20px;border-bottom:1px solid var(--border); }
  .gutter-spacer { width:48px;flex-shrink:0; }
  .day-header { flex:1;text-align:center;padding:8px 4px;font-size:12.5px;color:var(--text2);cursor:pointer;border-radius:8px 8px 0 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;-webkit-app-region:no-drag; }
  .day-header .dh-num { font-size:18px;font-weight:700;color:var(--text);display:block; }
  .day-header.today .dh-num { color:var(--accent); }
  .day-header.today { background:color-mix(in srgb, var(--accent2) 12%, transparent); }
  /* Día seleccionado (el que se resume en "Tareas de..." de la barra lateral): distinto
     de "hoy", para que se note incluso si coinciden. */
  .day-header.selected { box-shadow:inset 0 -3px 0 var(--accent); }

  .grid-scroll { flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 16px;-webkit-app-region:no-drag; }
  .grid-body { display:flex;position:relative; }
  .hour-gutter { width:48px;flex-shrink:0;position:relative; }
  .hour-cell { height:var(--row-h);position:relative; }
  .hour-cell span { position:absolute;top:-7px;right:8px;font-size:11.5px;color:var(--text2); }

  /* Marca de la hora actual, solo en la franja de horas (no cruza los días) */
  .now-tick { position:absolute;left:6px;right:0;height:0;border-top:2px solid var(--danger);pointer-events:none; }

  .day-col {
    flex:1;position:relative;border-left:1px solid var(--border);
    background-image: repeating-linear-gradient(to bottom, transparent, transparent calc(var(--row-h) - 1px), var(--border) calc(var(--row-h) - 1px), var(--border) var(--row-h));
    cursor:crosshair;-webkit-app-region:no-drag;
  }
  .day-col.today { background-color:color-mix(in srgb, var(--accent2) 8%, transparent); }
  .day-col.selected { box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent2) 38%, transparent); }

  .task-block {
    position:absolute;left:2px;right:2px;border-radius:6px;padding:8px 7px;
    font-size:12px;color:#fff;overflow:hidden;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1.3;-webkit-app-region:no-drag;
    display:flex;flex-direction:column;justify-content:center;
  }
  .task-block .tb-name {
    font-weight:600;overflow:hidden;white-space:normal;overflow-wrap:anywhere;
  }
  .task-block .tb-time { display:flex;flex-direction:column;align-items:flex-start;gap:1px;opacity:.85;font-size:11px;min-width:0; }
  .task-block .tb-time-top { display:flex;align-items:center;gap:5px;min-width:0;max-width:100%; }
  .task-block .tb-note-icon { flex-shrink:0;align-self:center; }
  .task-block .tb-note-preview {
    display:flex;align-items:flex-start;gap:5px;margin-top:3px;
    font-size:10.5px;font-weight:400;opacity:.9;line-height:1.25;
  }
  .task-block .tb-note-preview .tb-note-icon { margin-top:1px; }
  .task-block .tb-note-preview span {
    overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .task-block .tb-time-range { white-space:nowrap;min-width:0; }
  .task-block .tb-time-dur { flex-shrink:0;font-weight:700; }
  .task-block.ghost { opacity:.55;background:var(--accent2)!important;pointer-events:none; }
  .task-block.running { outline:1.5px solid var(--danger);outline-offset:1px; }
  .task-block.selected { outline:2px solid var(--accent); outline-offset:1px; z-index:4; }
  .task-block.moving { opacity:.35; cursor:grabbing !important; }
  .task-block.move-ghost {
    opacity:.55; pointer-events:none; z-index:15;
    box-shadow:0 4px 16px rgba(0,0,0,.45);
  }
  /* Transicion suave solo fuera de un arrastre activo */
  .task-block:not(.ghost):not(.move-ghost):not(.moving) {
    transition: top .15s ease, height .15s ease;
  }
  .cal-app.is-dnd .task-block { transition:none !important; }


  /* Tiradores para redimensionar un bloque arrastrando su borde superior/inferior:
     una barrita flotante tipo "home indicator" de iPhone. Verde = entrada normal,
     roja = esta es la tarea que está corriendo ahora mismo.
     El hitbox se mantiene pequeño (ancho y alto) y pegado al borde para que,
     en tareas cortas, siga habiendo sitio para hacer click en el bloque en vez
     de agarrar sin querer el tirador; además evita que se solape con el
     tirador del bloque contiguo cuando dos tareas están pegadas, que era lo
     que hacía parpadear el hover. */
  .tb-handle {
    position:absolute;left:50%;transform:translateX(-50%);width:52px;height:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:grab;opacity:0;transition:opacity .12s;z-index:6;
  }
  .tb-handle::after {
    content:'';box-sizing:border-box;width:42px;height:9px;border-radius:4px;
    background:var(--success);
    border:2px solid var(--handle-outline, rgba(0,0,0,.35));
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .tb-handle-top { top:1px; }
  .tb-handle-bottom { bottom:1px; }
  /* En entradas cortas los dos tiradores no caben a 12px sin comerse el bloque entero
     (y con él, el clic para abrir el popup): en esos casos se usan más finos, dejando
     siempre una franja central pulsable. */
  .tb-handle.compact { height:7px; }
  .tb-handle.compact::after { height:5px; }
  /* La zona de agarre puede salirse del bloque: asi un rato de cinco minutos sigue
     siendo agarrable sin tener que dibujarlo mas alto de lo que dura. La marca visible
     (::after) se queda dentro; lo que sobresale es solo el area sensible. */
  .task-block.corto .tb-handle, .task-block.mini .tb-handle { height:11px; }
  .task-block.corto .tb-handle-top, .task-block.mini .tb-handle-top { top:-4px; }
  .task-block.corto .tb-handle-bottom, .task-block.mini .tb-handle-bottom { bottom:-4px; }
  .task-block.mini .tb-handle::after { height:3px; }

  /* Ratos cortos: cabe el nombre y poco mas, asi que se aprieta la caja y se esconde
     lo prescindible en vez de dejar que todo se recorte a medias y no se lea nada. */
  .task-block.corto { padding:3px 6px;line-height:1.15;font-size:11px;justify-content:flex-start; }
  .task-block.corto .tb-name { white-space:nowrap;text-overflow:ellipsis; }
  .task-block.corto .tb-time { flex-direction:row;align-items:baseline;gap:5px;font-size:10px; }
  .task-block.corto .tb-time-range { display:none; }        /* la hora se ve en la rejilla */
  .task-block.corto .tb-note-preview { display:none; }
  .task-block.mini { padding:0 6px;font-size:10px;justify-content:center; }
  .task-block.mini .tb-name { white-space:nowrap;text-overflow:ellipsis; }
  .task-block.mini .tb-time, .task-block.mini .tb-note-preview { display:none; }
  .task-block:hover .tb-handle { opacity:1; }
  .tb-handle:active { cursor:grabbing; }
  .tb-handle.resizing { opacity:1;cursor:grabbing; }

  .tb-handle.running::after { background:var(--danger); }
  /* El tirador está a opacity:0 salvo con el ratón encima: animarlo siempre era repintar
     algo que no se ve. */
  .task-block:hover .tb-handle.running::after, .tb-handle.running.resizing::after { animation:tbHandlePulse 1.6s ease-in-out infinite; }
  @keyframes tbHandlePulse {
    0%,100% { box-shadow:0 0 0 0 rgba(248,113,113,.5); }
    70% { box-shadow:0 0 0 6px rgba(248,113,113,0); }
  }

  .drag-time-label {
    position:absolute;left:50%;top:-26px;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--accent);color:var(--text);
    font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
    padding:3px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:20;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }

  /* Popup (estilos genéricos .popup-backdrop/.entry-popup en shared.css) */
  .popup-time-row { display:flex;align-items:center;gap:8px; }
  .popup-time-row input[type=time] {
    flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:inherit;font-size:14px;padding:8px 9px;outline:none;color-scheme:dark;
  }

  /* Popup más ancho al crear (hay que elegir tarea entre muchas) */
  .entry-popup.wide { width:480px; }

  /* Nombre de la tarea editable en el popup de edición: se ve como un título,
     no como un input normal, hasta que se hace click/foco. Es un textarea (no un
     input de una línea) que crece solo con saltos de línea según el texto, para que
     los nombres largos no queden cortados ni se puedan desplazar de lado. */
  #popupTaskNameEdit {
    font-size:14.5px;font-weight:700;padding:6px 8px;
    resize:none;overflow:hidden;min-height:34px;line-height:1.35;
  }
  /* La nota también crece sola con el texto en vez de quedarse con scroll interno. */
  #popupNote { resize:none;overflow:hidden;min-height:52px; }

  /* Fila de subtarea dentro del popup de una entrada */
  .popup-sub-row { display:flex;align-items:center;gap:6px; }
  .popup-sub-row select { flex:1;min-width:0; }
  .popup-sub-btn {
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    width:32px;height:32px;border-radius:8px;
    background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer;

  /* Selector de tarea con buscador y secciones (popup de nueva entrada) */

  .tp-fold {
    width:24px;height:24px;border-radius:6px;flex-shrink:0;

  .tp-search-wrap { position:relative;display:flex;align-items:center; }
  .tp-search-wrap svg { position:absolute;left:10px;color:var(--text2);pointer-events:none; }
  .tp-search-wrap input { padding-left:32px !important; }
  .task-picker {
    height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--bg2);padding:4px;-webkit-app-region:no-drag;
  }
  .tp-section-chip {

  /* Cabecera de sección plegable, como en el panel de Guardadas */

  .tp-dot { width:9px;height:9px;border-radius:50%;flex-shrink:0; }

<script>
const { ipcRenderer, shell } = require('electron');

// Alto de cada hora en la cuadrícula. Dentro de la barra flotante se usa más zoom
// vertical: el panel es más estrecho, así que las tareas cortas quedaban minúsculas
// (y para moverse por el día ya está el scroll).
const ROW_H = 96;   // mismo zoom en ventana y en barra flotante
// El CSS (alto de cada celda de hora y las líneas de la rejilla) tiene que usar el mismo
// valor que los cálculos de JS; si no, los bloques quedan desplazados respecto a las horas.
document.documentElement.style.setProperty('--row-h', ROW_H + 'px');
const DOW = ['L','M','X','J','V','S','D'];
const DOW_LONG = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let currentState = null;
let miniViewYear, miniViewMonth;
let viewWeekStart;
let selectedDate;
let hiddenTaskIds = new Set();
let popupMode = null;
let popupCtx = null;
let dragState = null;
let resizeState = null; // espejo; el resize real vive en calDnD
let moveState = null;   // espejo; el move real vive en calDnD
let calDnDBusy = false;

function findEntryIndex(task, origStartMs, fallbackIdx) {
  if (!task || !task.entries) return -1;
  const byStart = task.entries.findIndex(e => e.start === origStartMs);
  if (byStart >= 0) return byStart;
  if (fallbackIdx >= 0 && fallbackIdx < task.entries.length) return fallbackIdx;
  return -1;
}

const calDnD = createCalendarDnD({
  getRowH: () => ROW_H,
  // Alargar, acortar y mover van de 5 en 5 minutos (crear arrastrando, de cuarto en cuarto).
  snapHour: (h) => Math.round(h * 12) / 12,
  clamp,
  startOfDay,
  sameDay,
  hourToHHMM,
  timeRangeLabel,
  formatDur,
  neighbourLimits: (...args) => neighbourLimits(...args),
  findEntryIndex,
  ipcRenderer,
  getCurrentState: () => currentState,
  getHiddenTaskIds: () => hiddenTaskIds,
  onBlockClick: (...args) => onBlockClick(...args),
  getPasteTarget: () => destinoPegado(),
  onPasted: (info) => onPasted(info),
  onCopied: (clip) => {
    toast(`Copiado · ${clip.nameAtTime}${clip.subNameAtTime ? ' · ' + clip.subNameAtTime : ''}`, 'copiar');
    pintarCursorPegado();
  },
  isPopupOpen: () => !!popupMode || RadialMenu.isOpen(),
  onInteractionEnd: () => { lastResizeEnd = Date.now(); },
  setBusyFlag: (busy) => {
    calDnDBusy = !!busy;
    resizeState = (busy && calDnD.getResizeState()) ? calDnD.getResizeState() : null;
    moveState = (busy && calDnD.getMoveState()) ? calDnD.getMoveState() : null;
  },
  getDayCols: () => document.querySelectorAll("#gridBody .day-col"),
});
calDnD.installClipboard();

let popupColor = COLORS[0];

function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d) { const x = startOfDay(d); const dow = (x.getDay()+6)%7; return addDays(x,-dow); }
function sameDay(a,b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function clamp(v,lo,hi) { return Math.max(lo, Math.min(hi, v)); }
function snapHour(h) { return Math.round(h*4)/4; }
function pad2(n) { return String(n).padStart(2,'0'); }
function hourToHHMM(h) { const hh = Math.floor(h); const mm = Math.round((h-hh)*60); return `${pad2(hh)}:${pad2(mm)}`; }
function hhmmToHour(str) { const [h,m] = (str||'0:0').split(':').map(Number); return h + m/60; }
function dateKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function formatDur(ms) {
  const totalMin = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
}
function timeRangeLabel(startMs, endMsOrNull) {
  const endLabel = endMsOrNull ? new Date(endMsOrNull).toTimeString().slice(0,5) : 'ahora';
  return `${new Date(startMs).toTimeString().slice(0,5)} - ${endLabel}`;
}

const today0 = startOfDay(new Date());

let tutorialActive = false;
function calendarStructuralSignature(state) {
  if (!state) return "";
  const parts = [];
  parts.push("a:" + (state.activeTaskId || ""));
  (state.tasks || []).forEach(t => {
    parts.push(t.id, t.name, t.color, t.archived ? "1" : "0", String((t.entries || []).length));
    (t.entries || []).forEach(e => {
      parts.push(String(e.start), e.end == null ? "R" : String(e.end), e.note || "", e.nameAtTime || "", e.subId || "");
    });
  });
  const st = state.settings || {};
  parts.push(JSON.stringify(st.weekOverrides || {}));
  parts.push(JSON.stringify(st.weekDays || {}));
  return parts.join("|");
}
let lastCalSignature = null;
let weekGridBuilt = false;

ipcRenderer.on('state', (_, state) => {
  currentState = state;
  let firstLoad = false;
  if (!viewWeekStart) {
    firstLoad = true;
    viewWeekStart = mondayOf(new Date());
    selectedDate = today0;
    miniViewYear = selectedDate.getFullYear();
    miniViewMonth = selectedDate.getMonth();
  }
  const sig = calendarStructuralSignature(state);
  const structuralChange = sig !== lastCalSignature;
  lastCalSignature = sig;
  if (!firstLoad && weekGridBuilt && !forceNextRenderWeek && !structuralChange && !calDnDBusy && !dragState) {
    // Tick de tarea en curso: actualizar bloques running sin reconstruir la rejilla.
    updateRunningBlocksLive();
    renderDayTotals();
    pintarTotalesDia();
    renderMiniCal();
  } else {
    renderAll();
  }
  refrescarFilaSubtarea();
  refrescarMenuDias();
  asignarSubtareaPendiente();
  if (firstLoad) scrollToNow();
  maybeStartTutorial();
});

// ---------- Totales por día, semana y mes ----------
// Cuánto ha cargado cada tarea dentro de un rango, contando solo el trozo que cae
// dentro (una entrada puede empezar antes y acabar después).
function totalsForRange(from, to) {
  const totals = [];
  if (!currentState) return totals;
  currentState.tasks.forEach(task => {
    let secs = 0;
    task.entries.forEach(entry => {
      const s = entry.start, e = entry.end || Date.now();
      if (e <= from || s >= to) return;
      secs += Math.max(0, (Math.min(e, to) - Math.max(s, from)) / 1000);
    });
    if (secs > 0) totals.push({ task, secs });
  });
  return totals.sort((a, b) => b.secs - a.secs);
}

// Pinta una de las tres listas. Al pulsar una tarea se muestran u ocultan sus bloques
// en la rejilla: eso lo hacía la lista "Tareas", que ya no está por repetir lo mismo
// sin decir cuánto tiempo llevaba cada una.
function renderTotalsInto(listId, totals, vacio) {
  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '';
  if (!totals.length) {
    list.innerHTML = `<div style="font-size:11px;color:var(--text2)">${vacio}</div>`;
    return;
  }
  let total = 0;
  totals.forEach(({ task, secs }) => {
    total += secs;
    const oculta = hiddenTaskIds.has(task.id);
    const item = document.createElement('div');
    item.className = 'legend-item' + (oculta ? ' hidden-task' : '') +
      (task.id === currentState.activeTaskId ? ' active-task' : '');
    item.title = 'Clic derecho: iniciar ahora';
    item.innerHTML = `
      <div class="legend-dot" style="background:${task.color}" title="Cambiar color"></div>
      <span class="legend-name">${task.name}${task.deleted ? ' <span class="legend-deleted-tag">(eliminada)</span>' : ''}</span>
      <span class="day-total-time" title="Clic: en horas o en decimales">${fmtHoras(secs * 1000)}</span>`;
    // 2.8.3: el clic ya no oculta sus bloques (no era práctico); el derecho la arranca.
    item.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); abrirMenuTareaLista(e, task); };
    // El punto de color cambia el color; y el tiempo, el formato de las horas.
    item.querySelector('.legend-dot').onclick = (e) => { e.stopPropagation(); abrirColorTarea(task); };
    item.querySelector('.day-total-time').onclick = alternarFormatoHoras;
    list.appendChild(item);
  });
  const suma = document.createElement('div');
  suma.className = 'totals-sum';
  suma.innerHTML = `<span>Total</span><span class="day-total-time" title="Clic: en horas o en decimales">${fmtHoras(total * 1000)}</span>`;
  suma.querySelector('.day-total-time').onclick = alternarFormatoHoras;
  list.appendChild(suma);
}

// ---------- Horas: «6h 30m» o en decimales («6,5 h») ----------
// Un clic en cualquier total (cabecera de cada día o barra lateral) cambia el formato, que
// se recuerda: para imputar suelen pedirse en decimales.
let horasDecimales = false;
try { horasDecimales = localStorage.getItem('imputa.horasDecimales') === '1'; } catch {}

function fmtHoras(ms) {
  if (!horasDecimales) return formatDur(ms);
  const h = Math.max(0, ms) / 3600000;
  return h.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' h';
}

function alternarFormatoHoras(e) {
  if (e) e.stopPropagation();
  horasDecimales = !horasDecimales;
  try { localStorage.setItem('imputa.horasDecimales', horasDecimales ? '1' : '0'); } catch {}
  renderDayTotals();
  pintarTotalesDia();
}

// Total de cada día visible, debajo de su nombre en la cabecera.
function pintarTotalesDia() {
  document.querySelectorAll('#weekHeader .day-header').forEach(h => {
    const el = h.querySelector('.dh-total');
    if (!el || !h._date) return;
    const ini = startOfDay(h._date).getTime();
    const ms = totalsForRange(ini, ini + 86400000).reduce((s, x) => s + x.secs, 0) * 1000;
    el.textContent = ms >= 60000 ? fmtHoras(ms) : '—';
    el.classList.toggle('vacio', ms < 60000);
  });
}

// ── Empezar una tarea desde el calendario ───────────────────────────────────
// Sin salir de aquí: elige una de las que ya tienes, o escribe una nueva con su
// sección. Solo puede haber una tarea en marcha, así que si hay otra corriendo se
// avisa de que se va a pausar (que es justo lo que se suele querer al cambiar de tarea).
const empSubsAbiertas = new Set();

function abrirEmpezar() {
  empSubsAbiertas.clear();
  document.getElementById('empezarBuscar').value = '';
  document.getElementById('empezarNombre').value = '';

  const sel = document.getElementById('empezarSeccion');
  sel.innerHTML = '';

  sel.appendChild(ninguna);
  ((currentState && currentState.groups) || []).forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.name;
    sel.appendChild(opt);
  });

  renderEmpezar();
  document.getElementById('empezarBackdrop').style.display = 'block';
  document.getElementById('empezarPopup').style.display = 'flex';
  document.getElementById('empezarBuscar').focus();
}

function cerrarEmpezar() {
  document.getElementById('empezarBackdrop').style.display = 'none';
  document.getElementById('empezarPopup').style.display = 'none';
}

function renderEmpezar() {
  if (!currentState) return;
  const activa = currentState.tasks.find(t => t.id === currentState.activeTaskId);
  document.getElementById('empezarAviso').textContent = activa
    ? `Ahora mismo corre "${activa.name}". Al empezar otra, esta se pausa sola.`
    : 'No hay ninguna tarea en marcha: la que elijas empieza a contar desde ahora.';

  const q = document.getElementById('empezarBuscar').value.trim().toLowerCase();
  const secciones = (currentState.groups || []);
  const nombreSec = (t) => (secciones.find(g => g.id === t.groupId) || {}).name || '';

  // Las últimas usadas primero: al cambiar de tarea casi siempre vuelves a una de ellas.
  const ultimoUso = (t) => t.entries.reduce((max, e) => Math.max(max, e.start), 0);
  const lista = currentState.tasks
    .filter(t => !t.deleted)
    .filter(t => !q || t.name.toLowerCase().includes(q) || nombreSec(t).toLowerCase().includes(q))
    .sort((a, b) => ultimoUso(b) - ultimoUso(a))
    .slice(0, 40);

  const cont = document.getElementById('empezarLista');
  cont.innerHTML = '';
  if (!lista.length) {
    cont.innerHTML = '<div style="font-size:11.5px;color:var(--text2);padding:8px 10px">Sin resultados. Escribe abajo para crear una nueva.</div>';
    return;
  }
  lista.forEach(t => {
    const nSubs = (t.subtasks || []).length;
    const abierta = empSubsAbiertas.has(t.id);

    const fila = document.createElement('div');
    fila.className = 'emp-fila';

    const b = document.createElement('button');
    b.className = 'emp-item' + (t.id === currentState.activeTaskId ? ' activa' : '');
    b.innerHTML = `
      <span class="emp-dot" style="background:${t.color}"></span>
      <span class="emp-nombre"></span>
      <span class="emp-sec"></span>`;
    b.querySelector('.emp-nombre').textContent = t.name;
    b.querySelector('.emp-sec').textContent = t.id === currentState.activeTaskId
      ? 'en marcha' : (nSubs ? `${nSubs} subtareas` : nombreSec(t));
    // Pulsar la tarea la arranca a secas: es el camino rápido y el más frecuente.
    b.onclick = () => empezarCon(t, null);
    fila.appendChild(b);

    // La flecha abre sus subtareas, para arrancar dentro de una en vez de la tarea
    // entera. Sale siempre, también sin subtareas, porque desde ahí se crea la primera.
    const chev = document.createElement('button');
    chev.className = 'emp-chevron' + (abierta ? ' abierta' : '');
    chev.title = nSubs ? 'Ver sus subtareas' : 'Empezar en una subtarea nueva';
    chev.innerHTML = '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4 4-4 4"/></svg>';
    chev.onclick = (e) => {
      e.stopPropagation();
      if (empSubsAbiertas.has(t.id)) empSubsAbiertas.delete(t.id); else empSubsAbiertas.add(t.id);
      renderEmpezar();
    };
    fila.appendChild(chev);
    cont.appendChild(fila);

    if (!abierta) return;
    const subs = document.createElement('div');
    subs.className = 'emp-subs';
    (t.subtasks || []).forEach(sub => {
      const sb = document.createElement('button');
      sb.className = 'emp-sub';
      sb.innerHTML = '<span class="emp-sub-bullet"></span><span class="emp-nombre"></span><span class="emp-sub-t"></span>';
      sb.querySelector('.emp-nombre').textContent = sub.name;
      sb.querySelector('.emp-sub-t').textContent = formatDur((sub.totalSecs || 0) * 1000);
      sb.onclick = () => empezarCon(t, sub.id);
      subs.appendChild(sb);
    });
    const nueva = document.createElement('button');
    nueva.className = 'emp-sub nueva';
    nueva.innerHTML = '<span class="emp-sub-bullet"></span><span class="emp-nombre">Nueva subtarea…</span>';
    nueva.onclick = async () => {
      const nombre = await askText({
        title: 'Nueva subtarea',
        text: `Se creará dentro de "${t.name}" y empezará a contar ya.`,
        placeholder: 'Nombre de la subtarea',
        okLabel: 'Crear y empezar', maxLength: 120,
      });
      if (nombre === null) return;
      const n = nombre.trim();
      if (!n) return;
      ipcRenderer.send('action', { type: 'add-subtask-and-start', payload: { taskId: t.id, name: n } });
      cerrarEmpezar();
    };
    subs.appendChild(nueva);
    cont.appendChild(subs);
  });
}

// ---------- Mini calendar ----------
function buildActivityDayKeys() {
  const set = new Set();
  if (!currentState) return set;
  for (const task of currentState.tasks) {
    for (const entry of task.entries) {
      let cur = startOfDay(new Date(entry.start));
      const end = startOfDay(new Date(entry.end || Date.now()));
      while (cur <= end) { set.add(dateKey(cur)); cur = addDays(cur,1); }
    }
  }
  return set;
}

function renderMiniCal() {
  document.getElementById('miniCalTitle').textContent = `${MONTHS[miniViewMonth]} ${miniViewYear}`;
  const grid = document.getElementById('miniCalGrid');
  grid.innerHTML = '';
  DOW.forEach(d => { const el = document.createElement('div'); el.className='mini-dow'; el.textContent=d; grid.appendChild(el); });

  const firstDay = new Date(miniViewYear, miniViewMonth, 1);
  let startDow = firstDay.getDay(); startDow = startDow===0?6:startDow-1;
  const totalDays = new Date(miniViewYear, miniViewMonth+1, 0).getDate();
  const dayMap = buildActivityDayKeys();
  const weekEnd = addDays(viewWeekStart, 7);

  const cells = [];
  for (let i=0;i<startDow;i++) cells.push({ date: new Date(miniViewYear,miniViewMonth,-startDow+i+1), other:true });
  for (let d=1;d<=totalDays;d++) cells.push({ date: new Date(miniViewYear,miniViewMonth,d), other:false });
  const remaining = 7-(cells.length%7);
  if (remaining<7) for (let i=1;i<=remaining;i++) cells.push({ date: new Date(miniViewYear,miniViewMonth+1,i), other:true });

  cells.forEach(({date,other}) => {
    const cell = document.createElement('div');
    const inWeek = date >= viewWeekStart && date < weekEnd;
    const isToday = sameDay(date, today0);
    const isSelected = selectedDate && sameDay(date, selectedDate);
    cell.className = 'mini-day' + (other?' other-month':'') + (inWeek?' in-week':'') + (isToday?' today':'') + (isSelected?' selected':'');
    cell.textContent = date.getDate();
    if (dayMap.has(dateKey(date))) {
      const dot = document.createElement('div'); dot.className='dot'; cell.appendChild(dot);
    }
    cell.onclick = () => {
      selectedDate = startOfDay(date);
      viewWeekStart = mondayOf(date);
      miniViewYear = date.getFullYear(); miniViewMonth = date.getMonth();
      renderAll();
    };
    grid.appendChild(cell);
  });
}

function miniPrevMonth() { miniViewMonth--; if (miniViewMonth<0){miniViewMonth=11;miniViewYear--;} renderMiniCal(); }
function miniNextMonth() { miniViewMonth++; if (miniViewMonth>11){miniViewMonth=0;miniViewYear++;} renderMiniCal(); }

// ---------- Días visibles de la semana ----------
// Por defecto los de Ajustes; si esa semana concreta tiene excepción, mandan los suyos.
// La clave es el lunes de la semana en AAAA-MM-DD.
function weekKey(d) {
  const l = startOfDay(d);
  return `${l.getFullYear()}-${pad2(l.getMonth() + 1)}-${pad2(l.getDate())}`;
}

function visibleWeekDays() {
  const st = (currentState && currentState.settings) || {};
  const ov = st.weekOverrides && st.weekOverrides[weekKey(viewWeekStart)];
  const dias = Array.isArray(ov) ? ov : (Array.isArray(st.weekDays) && st.weekDays.length ? st.weekDays : [1,2,3,4,5,6,0]);
  // Se devuelven las fechas de la semana en su orden natural, no en el del ajuste.
  const salida = [];
  for (let i = 0; i < 7; i++) {
    const fecha = addDays(viewWeekStart, i);
    if (dias.includes(fecha.getDay())) salida.push(fecha);
  }
  return salida.length ? salida : [viewWeekStart];
}

function semanaConExcepcion() {
  const st = (currentState && currentState.settings) || {};
  return !!(st.weekOverrides && st.weekOverrides[weekKey(viewWeekStart)]);
}

// 2.8.3: desplegable propio (de cristal, como los demás menús) en vez del menú de Windows.
const DIAS_MENU = [[1, 'Lunes'], [2, 'Martes'], [3, 'Miércoles'], [4, 'Jueves'], [5, 'Viernes'], [6, 'Sábado'], [0, 'Domingo']];
const CHECK_MENU = '<svg class="sort-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

// El cristal lo pone y lo quita este menú (no bocadillo.js, cuya copia de cierre dejaba un
// cuadrado blanco un momento en el panel lateral).
async function cerrarMenuDias() {
  const m = document.getElementById('menuDias');
  document.removeEventListener('pointerdown', fueraMenuDias, true);
  document.removeEventListener('keydown', escMenuDias, true);
  if (!m) return;
  m.removeAttribute('id');
  m.classList.add('cerrando');
  const g = m._vidrio;
  m._vidrio = null;
  if (g) { await g.salir(200); g.detach(); }
  else await new Promise(r => setTimeout(r, 180));
  m.remove();
}
function fueraMenuDias(e) {
  if (!e.target.closest('#menuDias, #weekDaysBtn')) cerrarMenuDias();
}
function escMenuDias(e) {
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cerrarMenuDias(); }
}

function pintarMenuDias(menu) {
  const clave = weekKey(viewWeekStart);
  const dias = visibleWeekDays().map(d => d.getDay());
  const hayExcepcion = semanaConExcepcion();
  // El estado llega cada segundo con una tarea en marcha: solo se rehace si algo cambió.
  const firma = clave + '|' + dias.join(',') + '|' + hayExcepcion;
  if (menu._firma === firma) return;
  menu._firma = firma;
  [...menu.children].forEach(c => { if (!c.classList.contains('lg-canvas')) c.remove(); });   // el cristal se queda
  menu.insertAdjacentHTML('beforeend', '<div class="sort-head">Días de esta semana</div>');
  DIAS_MENU.forEach(([n, nombre]) => {
    const b = document.createElement('button');
    b.className = 'sort-opt' + (dias.includes(n) ? ' active' : '');
    b.innerHTML = CHECK_MENU + `<span>${nombre}</span>`;
    b.onclick = () => {
      const nuevos = dias.includes(n) ? dias.filter(x => x !== n) : [...dias, n];
      if (!nuevos.length) return;   // dejar la semana sin días no tiene sentido
      enviar('set-week-override', { week: clave, days: nuevos });
    };
    menu.appendChild(b);
  });
  menu.insertAdjacentHTML('beforeend', '<div class="sort-sep"></div>');
  const volver = document.createElement('button');
  volver.className = 'sort-opt';
  volver.disabled = !hayExcepcion;
  volver.innerHTML = '<span class="sort-check"></span><span>Volver a mis días de siempre</span>';
  volver.onclick = () => enviar('set-week-override', { week: clave, days: null });
  const cambiar = document.createElement('button');
  cambiar.className = 'sort-opt';
  cambiar.innerHTML = '<span class="sort-check"></span><span>Cambiar mis días de siempre…</span>';
  cambiar.onclick = () => { cerrarMenuDias(); enviar('open-settings'); };
  menu.append(volver, cambiar);
}

function abrirMenuDias() {
  if (document.getElementById('menuDias')) { cerrarMenuDias(); return; }
  const menu = document.createElement('div');
  menu.id = 'menuDias';
  menu.className = 'sort-menu dias-menu open';
  menu.dataset.glass = 'no';   // bocadillo.js no lo toca: el cristal va aquí abajo
  const r = document.getElementById('weekDaysBtn').getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  pintarMenuDias(menu);
  document.body.appendChild(menu);
  if (window.LiquidGlass && LiquidGlass.supported() && document.documentElement.dataset.glass !== 'off') {
    menu.classList.add('lg-preparando');   // fuera de la foto del fondo
    LiquidGlass.attach(menu, {}).then((g) => {
      menu.classList.remove('lg-preparando');
      if (!g) return;
      if (!menu.isConnected || menu.classList.contains('cerrando')) { g.detach(); return; }
      menu._vidrio = g;
      menu.classList.add('lg-on', 'lg-entrando');
      g.entrar(420);
    });
  }
  document.addEventListener('pointerdown', fueraMenuDias, true);
  document.addEventListener('keydown', escMenuDias, true);
}
// Al llegar el estado nuevo (tras marcar un día), las marcas del menú abierto se ponen al día.
function refrescarMenuDias() {
  const m = document.getElementById('menuDias');
  if (m) pintarMenuDias(m);
}

// ---------- Week grid ----------
let forceNextRenderWeek = false;   // ver closePopup(): el popup tapaba el bloque, el próximo refresco no se debe saltar
function renderWeek() {
  // No reconstruir la rejilla mientras hay un arrastre/resize/move activo (destruiría el DOM en uso).
  // Ya NO se salta el render por :hover: los ticks de tarea en curso se atienden con
  // updateRunningBlocksLive() sin tirar abajo la rejilla (ver handler de "state").
  if (dragState || resizeState || moveState || calDnDBusy) return;
  forceNextRenderWeek = false;
  const weekEndDay = addDays(viewWeekStart, 6);
  const sameMonth = viewWeekStart.getMonth() === weekEndDay.getMonth();
  const label = sameMonth
    ? `${viewWeekStart.getDate()} - ${weekEndDay.getDate()} de ${MONTHS[weekEndDay.getMonth()].toLowerCase()} ${weekEndDay.getFullYear()}`
    : `${viewWeekStart.getDate()} ${MONTHS[viewWeekStart.getMonth()].toLowerCase()} - ${weekEndDay.getDate()} ${MONTHS[weekEndDay.getMonth()].toLowerCase()} ${weekEndDay.getFullYear()}`;
  document.getElementById('weekLabel').textContent = label;

  const header = document.getElementById('weekHeader');
  header.innerHTML = '<div class="gutter-spacer"></div>';
  const days = visibleWeekDays();
  const btnDias = document.getElementById('weekDaysBtn');
  if (btnDias) {
    btnDias.classList.toggle('con-excepcion', semanaConExcepcion());
    btnDias.title = semanaConExcepcion()
      ? 'Esta semana tiene días distintos de los de siempre'
      : 'Elegir qué días se ven';
  }
  days.forEach(date => {
    const el = document.createElement('div');
    const isToday = sameDay(date, today0);
    const isSelected = selectedDate && sameDay(date, selectedDate);
    el.className = 'day-header' + (isToday?' today':'') + (isSelected?' selected':'');
    el.innerHTML = `<span class="dh-num">${date.getDate()}</span>${DOW_LONG[(date.getDay()+6)%7]}<span class="dh-total" title="Horas del día · clic: en horas o en decimales"></span>`;
    el._date = date;
    el.onclick = () => { selectedDate = startOfDay(date); renderMiniCal(); renderDayTotals(); renderWeek(); };
    el.querySelector('.dh-total').onclick = alternarFormatoHoras;
    header.appendChild(el);
  });
  pintarTotalesDia();

  const gutter = document.getElementById('hourGutter');
  gutter.innerHTML = '';
  for (let h=0; h<24; h++) {
    const cell = document.createElement('div'); cell.className='hour-cell';
    cell.innerHTML = `<span>${h}:00</span>`;
    gutter.appendChild(cell);
  }
  gutter.style.height = (24*ROW_H)+'px';
  renderNowTick(gutter);

  const gridBody = document.getElementById('gridBody');
  gridBody.querySelectorAll('.day-col').forEach(el => el.remove());
  gridBody.style.height = (24*ROW_H)+'px';

  days.forEach(date => {
    const col = document.createElement('div');
    const isSelectedCol = selectedDate && sameDay(date, selectedDate);
    col.className = 'day-col' + (sameDay(date, today0) ? ' today' : '') + (isSelectedCol ? ' selected' : '');
    col.style.height = (24*ROW_H)+'px';
    col._date = date;
    attachDragHandlers(col);
    renderDayEntries(col, date);
    gridBody.appendChild(col);
  });
  weekGridBuilt = true;
  if (recienPegada && (recienPegada.hecha || Date.now() - recienPegada.t > 3000)) recienPegada = null;
  // Lo que no es parte del estado (el cursor de pegado y el borrador de una entrada nueva)
  // se vuelve a poner en la columna recién creada.
  pintarCursorPegado();
  pintarBorrador();
}

// Actualiza altura/etiqueta de bloques en curso sin reconstruir la semana.
function updateRunningBlocksLive() {
  if (!currentState || dragState || resizeState || moveState || calDnDBusy) return;
  const now = Date.now();
  document.querySelectorAll('.task-block.running[data-task-id]').forEach(block => {
    const col = block.closest('.day-col');
    if (!col || !col._date) return;
    const dayStart = startOfDay(col._date).getTime();
    const startMs = Number(block.dataset.startMs);
    if (!Number.isFinite(startMs)) return;
    const startH = (Math.max(startMs, dayStart) - dayStart) / 3600000;
    const endH = (Math.min(now, dayStart + 86400000) - dayStart) / 3600000;
    const blockH = Math.max(6, (endH - startH) * ROW_H - 2);
    block.style.top = (startH * ROW_H) + 'px';
    block.style.height = blockH + 'px';
    block.classList.remove('mini', 'corto', 'medio');
    if (blockH < 30) block.classList.add('mini');
    else if (blockH < 58) block.classList.add('corto');
    else if (blockH < 86) block.classList.add('medio');
    const durEl = block.querySelector('.tb-time-dur');
    if (durEl) durEl.textContent = formatDur(now - startMs);
    const rangeEl = block.querySelector('.tb-time-range');
    if (rangeEl) rangeEl.textContent = timeRangeLabel(startMs, null);
  });
  renderNowTickOnGrid();
}

function renderNowTickOnGrid() {
  const gutter = document.getElementById('hourGutter');
  if (!gutter) return;
  gutter.querySelectorAll('.now-tick').forEach(el => el.remove());
  renderNowTick(gutter);
}

let lastResizeEnd = 0;   // momento en que terminó el último redimensionado
let popupSelectedTaskId = null;   // tarea elegida en el selector ('__new__' = crear nueva)
const tpCollapsed = new Set();    // secciones plegadas en el selector de tarea

// Las claves de las secciones del selector: las mismas que usa renderTaskPicker.
function tpSectionKeys() {
  const groups = (currentState && currentState.groups) || [];
  return ['__active__', ...groups.map(g => g.id), '__none__'];
}
function tpColapsarTodo() { tpSectionKeys().forEach(k => tpCollapsed.add(k)); renderTaskPicker(); }
function tpExpandirTodo() { tpCollapsed.clear(); renderTaskPicker(); }

// Enter en el buscador va directo al primer resultado, sin soltar el teclado. El
// primer .tp-item de la lista es siempre "+ Nueva tarea"; con texto escrito, el
// siguiente es el primer resultado de verdad.
function tpElegirPrimero() {
  if (!document.getElementById('popupTaskSearch').value.trim()) return;
  const target = document.querySelectorAll('#popupTaskList .tp-item')[1];
  if (target) target.click();
}

function renderDayEntries(col, date) {
  if (!currentState) return;
  const dayStart = startOfDay(date).getTime();
  const dayEnd = dayStart + 86400000;
  currentState.tasks.forEach(task => {
    if (hiddenTaskIds.has(task.id)) return;
    task.entries.forEach((entry, idx) => {
      const s = entry.start, e = entry.end || Date.now();
      if (e <= dayStart || s >= dayEnd) return;
      const from = Math.max(s, dayStart), to = Math.min(e, dayEnd);
      const startH = (from - dayStart) / 3600000;
      const endH = (to - dayStart) / 3600000;
      const block = document.createElement('div');
      block.className = 'task-block' + (entry.end == null ? ' running' : '');
      // Alto real de la entrada, menos un pelo de separación para que dos seguidas no
      // se pisen visualmente. El mínimo solo evita que una entrada de un par de minutos
      // quede impulsable, sin llegar a invadir la siguiente.
      const BLOCK_GAP = 2, MIN_BLOCK_H = 6;
      const rawH = (endH - startH) * ROW_H;
      const blockH = Math.max(MIN_BLOCK_H, rawH - BLOCK_GAP);
      block.style.top = (startH*ROW_H)+'px';
      block.style.height = blockH + 'px';
      // Marcas de tamaño: por debajo de cierta altura no cabe todo y hay que ir
      // quitando cosas en vez de dejar que se recorten a medias.
      if (blockH < 30) block.classList.add('mini');
      else if (blockH < 58) block.classList.add('corto');
      else if (blockH < 86) block.classList.add('medio');   // el nombre, en una línea
      // 2.8: bloque macizo del color de la tarea, con el texto que más contraste (ver tonoBloque).
      const tono = tonoBloque(task.color);
      block.style.setProperty('--c', task.color);
      block.style.setProperty('--blk', tono.fondo);
      block.style.setProperty('--blk-txt', tono.texto);
      if (recienPegada && recienPegada.taskId === task.id && Math.abs(recienPegada.startMs - entry.start) < 1000) {
        block.classList.add('recien');
        recienPegada.hecha = true;
      }
      // El nombre que se ve es el que tenía la tarea CUANDO SE HIZO esta entrada
      // (entry.nameAtTime), no el actual: si luego renombras la tarea, el calendario
      // ya hecho no cambia solo.
      // Si la entrada era de una subtarea, se ve "Tarea · subtarea". El nombre de la
      // subtarea también es el de entonces: borrarla no reescribe el historial.
      const entryName = (entry.nameAtTime || task.name) +
        (entry.subNameAtTime ? ` · ${entry.subNameAtTime}` : '');
      const memoTip = (task && (task.memo || '').trim()) ? ('\nTarea: ' + task.memo.trim()) : '';
      block.title = (entry.note ? (entryName + '\nNota: ' + entry.note) : entryName) + memoTip;
      const durMs = (entry.end || Date.now()) - entry.start;
      const noteIcon = entry.note
        ? `<svg class="tb-note-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 5z"/></svg>`
        : '';
      // El texto de la nota se ve en la propia tarjeta (no solo con el icono/tooltip),
      // pero solo si hay sitio de sobra: en bloques cortos solo cabría cortada.
      const notePreview = (entry.note && blockH >= 56)
        ? `<div class="tb-note-preview">${noteIcon}<span>${entry.note}</span></div>`
        : '';
      block.innerHTML = `<div class="tb-name">${entryName}</div><div class="tb-time"><span class="tb-time-top">${notePreview ? '' : noteIcon}<span class="tb-time-range">${timeRangeLabel(entry.start, entry.end)}</span></span><span class="tb-time-dur">${formatDur(durMs)}</span></div>${notePreview}`;
      block.dataset.taskId = task.id;
      block.dataset.startMs = String(entry.start);
      block.dataset.entryIndex = String(idx);
      calDnD.applySelectedClass(block, task.id, entry.start);
      // Clic / arrastre: attachMoveHandlers decide (umbral → mover; si no, seleccionar).
      calDnD.attachMoveHandlers(block, task, idx, entry, col);
      // 2.8: clic derecho → menú circular (antes, el menú nativo de Windows).
      block.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        calDnD.markSelected(block, task.id, entry.start);
        abrirMenuEntrada(ev, task, idx, entry, block);
      });

      // Los tiradores siempre se pueden usar, incluso en entradas cortas: por debajo de
      // 40px se usa la variante "compact" (más fina), que deja hueco de sobra para que
      // el centro del bloque siga pudiéndose pulsar para abrir el popup.
      const handleOutline = contrastTextColor(task.color);
      const compactHandles = blockH < 40;
      if (from === s) {
        const topHandle = document.createElement('div');
        topHandle.className = 'tb-handle tb-handle-top' + (entry.end == null ? ' running' : '') + (compactHandles ? ' compact' : '');
        topHandle.style.setProperty('--handle-outline', handleOutline);
        calDnD.attachResizeHandle(topHandle, 'start', task, idx, entry, block, col);
        block.appendChild(topHandle);
      }
      // El tirador inferior ajusta la hora de fin; solo si la entrada ya tiene fin
      // (no está en curso) y este segmento contiene realmente ese fin.
      if (entry.end != null && to === e) {
        const bottomHandle = document.createElement('div');
        bottomHandle.className = 'tb-handle tb-handle-bottom' + (compactHandles ? ' compact' : '');
        bottomHandle.style.setProperty('--handle-outline', handleOutline);
        calDnD.attachResizeHandle(bottomHandle, 'end', task, idx, entry, block, col);
        block.appendChild(bottomHandle);
      }

      col.appendChild(block);
    });
  });
}

// Relleno y texto de un bloque: el color de la tarea casi puro (templado un pelo con el
// fondo del tema para que no deslumbre) y, encima, blanco o casi negro: el que tenga más
// contraste de verdad (luminancia relativa, como mide la WCAG), no a ojo.
function tonoBloque(hex) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(hex || ''));
  if (!m) return { fondo: hex || '#8b8b8b', texto: '#ffffff' };
  const claro = document.documentElement.dataset.scheme === 'light';
  const base = claro ? [255, 255, 255] : [26, 21, 24];
  const k = claro ? 0.9 : 0.8;   // cuánto color de la tarea lleva el relleno
  const n = parseInt(m[1], 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v, i) => Math.round(v * k + base[i] * (1 - k)));
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
  const OSCURO = '#1d1a1c', L_OSCURO = 0.0113;
  const contraBlanco = 1.05 / (L + 0.05), contraOscuro = (L + 0.05) / (L_OSCURO + 0.05);
  return { fondo: `rgb(${c.join(',')})`, texto: contraBlanco >= contraOscuro ? '#ffffff' : OSCURO };
}
// Al cambiar de tema cambia el templado: se repinta la rejilla.
window.addEventListener('theme-change', () => { if (weekGridBuilt) renderWeek(); });

// Hasta dónde se puede estirar una entrada sin pisar a las de al lado: devuelve el fin
// de la entrada anterior y el inicio de la siguiente. Así el borde hace tope y, si se
// arrastra a fondo, una acaba justo cuando empieza la otra (sin solaparse ni dejar hueco).
function neighbourLimits(task, idx, entry, dayStart) {
  const dayEnd = dayStart + 86400000;
  const myStart = entry.start;
  const myEnd = entry.end || Date.now();
  let lower = dayStart, upper = dayEnd;
  (currentState.tasks || []).forEach(t => {
    if (hiddenTaskIds.has(t.id)) return;   // si no se ve, no debe estorbar
    t.entries.forEach((e, i) => {
      if (t.id === task.id && i === idx) return;   // la que se está moviendo
      const s = e.start, en = e.end || Date.now();
      if (en <= dayStart || s >= dayEnd) return;   // de otro día
      if (en <= myStart) lower = Math.max(lower, en);      // queda por encima
      if (s >= myEnd)    upper = Math.min(upper, s);       // queda por debajo
    });
  });
  return { lower, upper };
}

// attachResizeHandle vive en calendar-dnd.js (calDnD.attachResizeHandle).
function renderNowTick(gutter) {
  const weekEnd = addDays(viewWeekStart, 7);
  if (today0 < viewWeekStart || today0 >= weekEnd) return; // la semana visible no incluye hoy
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  const tick = document.createElement('div');
  tick.className = 'now-tick';
  tick.style.top = (h * ROW_H) + 'px';
  gutter.appendChild(tick);
}

function scrollToNow() {
  const el = document.getElementById('gridScroll');
  const h = new Date().getHours();
  el.scrollTop = Math.max(0, (h-2)*ROW_H);
}

// ---------- Huecos: clic, doble clic y arrastrar para crear ----------
// 2.8: un clic en un hueco deja ahí el cursor de pegado (y quita la selección); doble clic
// crea una entrada de media hora; arrastrar dibuja la entrada nueva. Con el botón derecho,
// el menú circular del hueco.
let ultimoClicHueco = null;

function horaEn(col, clientY) {
  const rect = col.getBoundingClientRect();
  return snapHour(clamp((clientY - rect.top) / ROW_H, 0, 24));
}

function attachDragHandlers(col) {
  col.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.task-block, .paste-caret')) return;
    if (calDnDBusy || moveState || resizeState) return;
    calDnD.clearSelected();
    const startHour = horaEn(col, e.clientY);
    dragState = { col, date: col._date, startHour, curHour: startHour, ghost: null, label: null, x0: e.clientX, y0: e.clientY, movido: false };
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  });
  col.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.task-block')) return;
    e.preventDefault();
    calDnD.clearSelected();
    abrirMenuHueco(e, col, horaEn(col, e.clientY));
  });
}

function onDragMove(e) {
  if (!dragState) return;
  if (!dragState.movido) {
    // Hasta que no se mueve un poco es un clic, no un arrastre.
    if (Math.abs(e.clientY - dragState.y0) < 6 && Math.abs(e.clientX - dragState.x0) < 6) return;
    dragState.movido = true;
    quitarCursorPegado();
    const ghost = document.createElement('div');
    ghost.className = 'task-block ghost';
    dragState.col.appendChild(ghost);
    const label = document.createElement('div');
    label.className = 'drag-time-label';
    dragState.col.appendChild(label);
    dragState.ghost = ghost; dragState.label = label;
  }
  dragState.curHour = horaEn(dragState.col, e.clientY);
  const lo = Math.min(dragState.startHour, dragState.curHour);
  const hi = Math.max(dragState.startHour, dragState.curHour);
  dragState.ghost.style.top = (lo*ROW_H)+'px';
  dragState.ghost.style.height = Math.max(4,(hi-lo)*ROW_H)+'px';
  dragState.label.style.top = (lo*ROW_H - 30)+'px';
  dragState.label.textContent = `${hourToHHMM(lo)} – ${hourToHHMM(hi)}`;
}

function onDragEnd() {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  if (!dragState) return;
  const ds = dragState;
  dragState = null;
  if (!ds.movido) {
    const ahora = Date.now();
    const doble = ultimoClicHueco && ahora - ultimoClicHueco.t < 450 && ultimoClicHueco.col === ds.col
      && Math.abs(ultimoClicHueco.hour - ds.startHour) <= 0.25;
    ultimoClicHueco = doble ? null : { t: ahora, col: ds.col, hour: ds.startHour };
    if (doble) {
      quitarCursorPegado();
      const lo = Math.min(ds.startHour, 23.5);
      abrirNuevaEntrada(ds.date, lo, lo + 0.5);
    } else {
      ponerCursorPegado(ds.date, ds.startHour);
    }
    return;
  }
  let lo = Math.min(ds.startHour, ds.curHour);
  let hi = Math.max(ds.startHour, ds.curHour);
  if (hi - lo < 0.25) { hi = Math.min(24, lo + 0.5); lo = Math.max(0, hi - 0.5); }
  ds.ghost.remove();
  ds.label.remove();
  abrirNuevaEntrada(ds.date, lo, hi);
}

// ---------- Borrador de la entrada nueva ----------
// Mientras el bocadillo de "Nueva entrada" está abierto, en la rejilla se ve dónde va a
// quedar (y el bocadillo le apunta con la gotita). Sigue al cambiar las horas.
let borrador = null;   // { date, lo, hi }

function abrirNuevaEntrada(date, lo, hi) {
  borrador = { date: startOfDay(date), lo, hi };
  openCreatePopup(date, lo, hi);
}

// Al cambiar las horas en el bocadillo, el borrador de la rejilla se mueve con ellas.
function moverBorradorDesdeHoras() {
  if (popupMode !== 'create' || !borrador) return;
  const a = document.getElementById('popupStart').value, b = document.getElementById('popupEnd').value;
  if (!a) return;
  const lo = hhmmToHour(a);
  const hi = b ? hhmmToHour(b) : lo + 0.5;
  if (!(hi > lo)) return;
  borrador.lo = lo; borrador.hi = hi;
  pintarCabeceraPopup(null, null, borrador.date, lo, hi);
  reapuntarPopup(pintarBorrador());
}
document.getElementById('popupStart').addEventListener('input', moverBorradorDesdeHoras);
document.getElementById('popupEnd').addEventListener('input', moverBorradorDesdeHoras);

function colDe(date) {
  return Array.from(document.querySelectorAll('#gridBody .day-col')).find(c => c._date && sameDay(c._date, date)) || null;
}

function pintarBorrador() {
  document.querySelectorAll('.task-block.borrador').forEach(el => el.remove());
  if (!borrador || popupMode !== 'create') return null;
  const col = colDe(borrador.date);
  if (!col) return null;
  const el = document.createElement('div');
  el.className = 'task-block ghost borrador';
  el.style.top = (borrador.lo * ROW_H) + 'px';
  el.style.height = Math.max(6, (borrador.hi - borrador.lo) * ROW_H - 2) + 'px';
  const tarea = (currentState.tasks || []).find(t => t.id === popupSelectedTaskId);
  if (tarea) el.style.setProperty('--c', tarea.color);
  el.innerHTML = `<div class="tb-name"></div><div class="tb-time"><span class="tb-time-range">${hourToHHMM(borrador.lo)} - ${hourToHHMM(borrador.hi)}</span></div>`;
  el.querySelector('.tb-name').textContent = tarea ? tarea.name : 'Nueva entrada';
  col.appendChild(el);
  return el;
}

function quitarBorrador() {
  borrador = null;
  document.querySelectorAll('.task-block.borrador').forEach(el => el.remove());
}

// ---------- Cursor de pegado ----------
// Donde hiciste clic en un hueco: Ctrl+V pega ahí. Si hay algo copiado se ve ya en su sitio
// (con su color y lo que dura), para que no haya sorpresas.
let cursorPegado = null;   // { date, hour }

function ponerCursorPegado(date, hour) {
  cursorPegado = { date: startOfDay(date), hour };
  pintarCursorPegado(true);
}

function quitarCursorPegado() {
  cursorPegado = null;
  document.querySelectorAll('.paste-caret').forEach(el => el.remove());
}

function destinoPegado() {
  if (!cursorPegado) return null;
  const col = colDe(cursorPegado.date);
  return { dayCol: col || { _date: cursorPegado.date }, hour: cursorPegado.hour };
}

function pintarCursorPegado(nuevo) {
  document.querySelectorAll('.paste-caret').forEach(el => el.remove());
  if (!cursorPegado) return;
  const col = colDe(cursorPegado.date);
  if (!col) return;
  const clip = calDnD.getClipboard();
  const el = document.createElement('div');
  el.className = 'paste-caret' + (clip ? ' con-copia' : '') + (nuevo ? ' nuevo' : '');
  el.style.top = (cursorPegado.hour * ROW_H) + 'px';
  if (clip) {
    const dayStart = startOfDay(cursorPegado.date).getTime();
    const hueco = calDnD.findGap(dayStart, dayStart + cursorPegado.hour * 3600000, clip.durationMs);
    const ini = hueco ? (hueco.startMs - dayStart) / 3600000 : cursorPegado.hour;
    const fin = hueco ? (hueco.endMs - dayStart) / 3600000 : cursorPegado.hour + clip.durationMs / 3600000;
    el.style.top = (ini * ROW_H) + 'px';
    el.innerHTML = `<div class="pc-preview" style="--c:${clip.color};height:${Math.max(8, (fin - ini) * ROW_H - 2)}px"><span class="pc-name"></span></div>
      <div class="pc-label" title="Clic para pegar"><b>Ctrl+V</b> pegar aquí · ${hourToHHMM(ini)}</div>`;
    el.querySelector('.pc-name').textContent = clip.nameAtTime + (clip.subNameAtTime ? ' · ' + clip.subNameAtTime : '');
    // 2.8.3: clic en la vista previa o en la etiqueta = pegar ahí (como Ctrl+V).
    el.querySelectorAll('.pc-preview, .pc-label').forEach(x => {
      x.addEventListener('pointerdown', (e) => e.stopPropagation());
      x.addEventListener('click', (e) => { e.stopPropagation(); calDnD.pasteNow(); pintarCursorPegado(); });
    });
    if (!hueco) el.classList.add('no-cabe');
  } else {
    el.innerHTML = `<div class="pc-label">${hourToHHMM(cursorPegado.hour)}</div>`;
  }
  col.appendChild(el);
}

// Lo que se acaba de pegar brilla un momento al aparecer, y si se pegó en el cursor, el
// cursor baja detrás (así varios Ctrl+V seguidos se van poniendo uno tras otro).
let recienPegada = null;
function onPasted(info) {
  if (!info) { toast('Ahí no cabe: no hay hueco libre', 'aviso'); return; }
  recienPegada = { taskId: info.taskId, startMs: info.startMs, t: Date.now() };
  const clip = calDnD.getClipboard();
  if (cursorPegado && info.dayCol && info.dayCol._date && sameDay(info.dayCol._date, cursorPegado.date) && clip) {
    const dayStart = startOfDay(cursorPegado.date).getTime();
    cursorPegado.hour = Math.min(24, (info.startMs + clip.durationMs - dayStart) / 3600000);
  }
  toast(info.recortada ? 'Pegado (recortado para que quepa en el hueco)' : 'Pegado', 'pegar');
}

// ---------- Clic en una entrada ----------
let ultimoClicBloque = null;
function onBlockClick(task, idx, entry, block) {
  quitarCursorPegado();
  const key = task.id + '|' + entry.start;
  const ahora = Date.now();
  if (ultimoClicBloque && ultimoClicBloque.key === key && ahora - ultimoClicBloque.t < 450) {
    ultimoClicBloque = null;
    openEditPopup(task, idx, entry, block);
    return;
  }
  ultimoClicBloque = { key, t: ahora };
}

function bloqueDe(taskId, startMs) {
  return document.querySelector(`.task-block[data-task-id="${CSS.escape(String(taskId))}"][data-start-ms="${startMs}"]`);
}

// ---------- Teclado ----------
// Ctrl+C / Ctrl+V / Ctrl+D están en calendar-dnd.js. Aquí: Supr borra (preguntando), Intro
// abre los detalles y Esc suelta la selección y el cursor de pegado.
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
  if (RadialMenu.isOpen()) return;
  if (popupMode) {
    if (e.key === 'Escape' && !document.querySelector('.ask-backdrop')) { e.preventDefault(); closePopup(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const sel = calDnD.selectedEntry();
  if (e.key === 'Escape') {
    calDnD.clearSelected(); quitarCursorPegado();
  } else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
    e.preventDefault();
    confirmarEliminarEntrada(sel.task, sel.idx);
  } else if (e.key === 'Enter' && sel) {
    e.preventDefault();
    openEditPopup(sel.task, sel.idx, sel.entry, sel.block);
  }
});

function confirmarEliminarEntrada(task, idx) {
  const entry = task.entries[idx];
  if (!entry) return;
  const nombre = (entry.nameAtTime || task.name) + (entry.subNameAtTime ? ` · ${entry.subNameAtTime}` : '');
  showConfirmPopup('Eliminar entrada',
    `Se borra este rato de "${nombre}" (${timeRangeLabel(entry.start, entry.end)}, ${formatDur((entry.end || Date.now()) - entry.start)}).`,
    'Eliminar',
    () => {
      const actual = (currentState.tasks || []).find(t => t.id === task.id);
      const i = actual ? findEntryIndex(actual, entry.start, idx) : -1;
      if (i < 0) return;
      ipcRenderer.send('action', { type: 'delete-entry', payload: { taskId: task.id, entryIndex: i } });
      toast('Entrada eliminada', 'borrar');
    });
}

// ---------- Avisos cortos ----------
let toastTimer = null;
function toast(texto, tipo) {
  let el = document.getElementById('calToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'calToast';
    el.className = 'cal-toast';
    document.body.appendChild(el);
  }
  el.dataset.tipo = tipo || '';
  el.textContent = texto;
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
}

function enviar(type, payload) { ipcRenderer.send('action', { type, payload }); }

function nombreEntrada(task, entry) {
  return (entry.nameAtTime || task.name) + (entry.subNameAtTime ? ` · ${entry.subNameAtTime}` : '');
}

function abrirMenuEntrada(ev, task, idx, entry, block) {
  quitarCursorPegado();
  const enMarcha = currentState.activeTaskId === task.id;
  const enCurso = entry.end == null;
  const sub = entry.subId && (task.subtasks || []).some(x => x.id === entry.subId) ? entry.subId : undefined;
  const items = [
    { label: 'Detalles', hint: 'Intro · doble clic', icon: IC.info, run: () => openEditPopup(task, idx, entry, bloqueDe(task.id, entry.start)) },
  ];
  if (task.deleted) {
    items.push({ label: 'Restaurar tarea', icon: IC.undo, tone: 'success', run: () => enviar('restore-task', { taskId: task.id }) });
  } else if (enMarcha) {
    items.push({ label: enCurso ? 'Pausar' : 'Pausar la tarea', icon: IC.pause, tone: 'danger', run: () => enviar('pause') });
  } else {
    items.push({ label: 'Seguir desde ahora', hint: 'Entrada nueva con la misma nota', icon: IC.play, tone: 'success',
      run: () => enviar('switch-task', { taskId: task.id, subId: sub, note: entry.note }) });
    if (!enCurso) items.push({ label: 'Alargar hasta ahora', hint: 'Esta misma, sin cortar', icon: IC.extend, tone: 'accent',
      run: () => showConfirmPopup('Alargar entrada',
        'Esta entrada se alarga desde su hora de inicio hasta ahora mismo, en vez de crear una nueva.',
        'Alargar', () => enviar('resume-entry', { taskId: task.id, entryIndex: idx })) });
  }
  items.push(
    { label: 'Copiar', hint: 'Ctrl+C', icon: IC.copy, run: () => { calDnD.markSelected(bloqueDe(task.id, entry.start), task.id, entry.start); calDnD.copySelected(); } },
    { label: 'Duplicar', hint: 'Ctrl+D · justo detrás', icon: IC.dup, run: () => { calDnD.markSelected(bloqueDe(task.id, entry.start), task.id, entry.start); calDnD.duplicateSelected(); } },
  );
  // Lo de ESTE rato (la sección y el color son de la tarea entera: se ponen en Tareas).
  if (!task.deleted) {
    const subs = task.subtasks || [];
    items.push({
      label: 'Subtarea', hint: entry.subNameAtTime || 'A qué parte de la tarea fue', icon: IC.sub,
      sub: () => ({
        kind: 'list', title: 'Subtarea de este rato',
        items: [
          { label: 'Sin subtarea', icon: IC.menos, selected: !entry.subId, run: () => ponerSubtareaEntrada(task, entry, idx, '') },
          ...subs.map(s => ({ label: s.name, icon: IC.punto, selected: entry.subId === s.id, run: () => ponerSubtareaEntrada(task, entry, idx, s.id) })),
          { separator: true },
          { label: 'Subtarea nueva…', icon: IC.plus, run: () => crearSubtareaParaEntrada(task, entry) },
        ],
      }),
    });
    items.push({ label: entry.note ? 'Cambiar nota' : 'Añadir nota', hint: entry.note || 'Solo de este rato', icon: IC.nota,
      run: () => editarNotaEntrada(task, entry, idx) });

  items.push({ label: 'Eliminar entrada', hint: 'Supr', icon: IC.trash, tone: 'danger', run: () => confirmarEliminarEntrada(task, idx) });

    x: ev.clientX, y: ev.clientY,
    title: nombreEntrada(task, entry),
    subtitle: `${timeRangeLabel(entry.start, entry.end)} · ${formatDur((entry.end || Date.now()) - entry.start)}`,
