// ---------- Subtarea y nota de un rato (desde el menú circular) ----------
// El índice de la entrada se vuelve a buscar al guardar: entre abrir el menú y elegir puede
// haber llegado un estado nuevo.
function indiceActual(task, entry, idx) {
  const t = (currentState.tasks || []).find(x => x.id === task.id);
  return t ? findEntryIndex(t, entry.start, idx) : -1;
}

function ponerSubtareaEntrada(task, entry, idx, subId) {
  const i = indiceActual(task, entry, idx);
  if (i < 0) return;
  enviar('edit-entry', { taskId: task.id, entryIndex: i, subId: subId || '' });
}

// La subtarea nueva la crea el proceso principal (le pone el id); cuando llega en el
// siguiente estado se le asigna a este rato (ver el manejador de 'state').
let subtareaParaEntrada = null;
async function crearSubtareaParaEntrada(task, entry) {
  const nombre = await askText({
    title: 'Subtarea nueva',
    text: `Se crea dentro de "${task.name}" y se asigna a este rato.`,
    placeholder: 'Nombre de la subtarea', okLabel: 'Crear', maxLength: 120,
  });
  if (nombre === null) return;
  const n = nombre.trim();
  if (!n) return;
  subtareaParaEntrada = { taskId: task.id, start: entry.start, name: n };
  enviar('add-subtask', { taskId: task.id, name: n });
}
function asignarSubtareaPendiente() {
  const p = subtareaParaEntrada;
  if (!p || !currentState) return;
  const t = currentState.tasks.find(x => x.id === p.taskId);
  const sub = t && (t.subtasks || []).filter(s => s.name === p.name).pop();
  if (!sub) return;
  subtareaParaEntrada = null;
  const i = findEntryIndex(t, p.start, -1);
  if (i >= 0) enviar('edit-entry', { taskId: t.id, entryIndex: i, subId: sub.id });
}

async function editarNotaEntrada(task, entry, idx) {
  const nota = await askText({
    title: entry.note ? 'Nota de este rato' : 'Añadir una nota',
    text: 'Solo de este rato; la nota fija de la tarea se cambia en Tareas.',
    value: entry.note || '', placeholder: '¿Qué hiciste en este rato?', okLabel: 'Guardar', maxLength: 500,
  });
  if (nota === null) return;
  const i = indiceActual(task, entry, idx);
  if (i < 0) return;
  enviar('edit-entry', { taskId: task.id, entryIndex: i, note: nota.trim() });
}

// ---------- Popup ----------
function openCreatePopup(date, startHour, endHour) {
  popupMode = 'create';
  popupCtx = { date };
  document.getElementById('popupTitle').textContent = 'Nueva entrada';
  document.getElementById('popupTitle').style.display = '';
  document.getElementById('popupTaskNameEdit').style.display = 'none';
  document.getElementById('popupDeleteBtn').style.display = 'none';

  document.getElementById('entryPopup').classList.add('wide');   // más ancho para elegir tarea
  document.getElementById('popupQuickActions').innerHTML = '';   // solo aplica a entradas ya existentes
  document.getElementById('popupSubRow').style.display = 'none';
  document.getElementById('popupTaskPicker').style.display = '';
  document.getElementById('popupTaskSearch').value = '';
  // Preseleccionada, la que se ha usado más recientemente: es la que casi siempre toca
  // repetir, y ahora coincide con la que sale primero en la lista.
  // Las del Archivador tampoco: no salen en la lista, así que no pueden venir marcadas.
  const activos = (currentState.tasks || []).filter(t => !t.archived && !t.deleted && !t.inactive);
  const candidatos = activos.length ? activos : (currentState.tasks || []).filter(t => !t.deleted && !t.inactive);
  const first = candidatos.slice().sort((a, b) => lastUsedMs(b) - lastUsedMs(a))[0];
  popupSelectedTaskId = first ? first.id : '__new__';
  poblarPopupNewTaskSection();
  renderTaskPicker();

  document.getElementById('popupStart').value = hourToHHMM(startHour);
  document.getElementById('popupEnd').value = hourToHHMM(endHour);
  document.getElementById('popupNote').value = '';
  updatePopupTaskMemo((currentState.tasks || []).find(t => t.id === popupSelectedTaskId));
  pintarCabeceraPopup(null, null, date, startHour, endHour);

  buildPopupColorPicker();
  if (!borrador || !sameDay(borrador.date, date)) borrador = { date: startOfDay(date), lo: startHour, hi: endHour };
  showPopup(pintarBorrador(), () => document.getElementById('popupTaskSearch').focus());
}

// Cuándo se usó una tarea por última vez (marca de la última entrada). Sirve para poner
// las más recientes primero en los selectores de tarea, que es lo que casi siempre se
// busca.
function lastUsedMs(t) {
  return (t.entries || []).reduce((max, e) => Math.max(max, e.start || 0), 0);
}

// Lista de tareas con buscador y agrupadas por sección (las guardadas) más las activas.
function renderTaskPicker() {
  const list = document.getElementById('popupTaskList');
  const q = document.getElementById('popupTaskSearch').value.trim().toLowerCase();
  list.innerHTML = '';

  const addItem = (label, id, color, sectionName) => {
    const el = document.createElement('div');
    el.className = 'tp-item' + (popupSelectedTaskId === id ? ' selected' : '');
    el.innerHTML = color
      ? `<div class="tp-dot" style="background:${color}"></div><span class="tp-name"></span>`
      : `<span class="tp-name tp-new"></span>`;
    el.querySelector('.tp-name').textContent = label;
    el.title = label;
    // Al buscar mostramos a qué sección pertenece cada resultado.
    if (q && sectionName) {
      const chip = document.createElement('span');
      chip.className = 'tp-section-chip'; chip.textContent = sectionName;
      el.appendChild(chip);
    }
    el.onclick = () => { popupSelectedTaskId = id; onPopupTaskChange(); renderTaskPicker(); updatePopupTaskMemo((currentState.tasks||[]).find(t=>t.id===id)); };
    list.appendChild(el);
  };

  addItem('+ Nueva tarea', '__new__', null);

  // Las tareas borradas no se pueden elegir para una entrada nueva (siguen en el
  // calendario como registro, pero ya no son "tareas" activas de verdad). Las que
  // llevan mucho sin usarse están en el Archivador (Guardadas): se sacan de ahí, no
  // se crean desde aquí.
  const tasks = (currentState.tasks || []).filter(t => !t.deleted && !t.inactive);
  const groups = currentState.groups || [];
  const orphans = tasks.filter(t => t.archived && !groups.some(g => g.id === t.groupId));

  // Secciones: tareas activas, cada sección guardada y las huérfanas. Dentro de cada
  // una, la usada más recientemente primero: es la que casi siempre se busca.
  const porRecencia = (a, b) => lastUsedMs(b) - lastUsedMs(a);
  const sections = [{ key: '__active__', name: 'Tareas activas', tasks: tasks.filter(t => !t.archived).sort(porRecencia) }];
  groups.forEach(g => sections.push({ key: g.id, name: g.name, tasks: tasks.filter(t => t.archived && t.groupId === g.id).sort(porRecencia) }));
  if (orphans.length) sections.push({ key: '__none__', name: 'Sin sección', tasks: orphans.sort(porRecencia) });

  let anyShown = false;
  sections.forEach(sec => {
    // Buscar por el nombre de la sección muestra todas sus tareas.
    const secMatches = q && sec.name.toLowerCase().includes(q);
    const items = secMatches ? sec.tasks : sec.tasks.filter(t => !q || t.name.toLowerCase().includes(q));
    if (!items.length) return;
    anyShown = true;
    const collapsed = !q && tpCollapsed.has(sec.key);   // al buscar se despliega todo

    const head = document.createElement('div');
    head.className = 'tp-group' + (collapsed ? ' collapsed' : '');
    head.innerHTML = `<svg class="tp-chevron" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1l4 4-4 4"/></svg><span class="tp-group-name"></span><span class="tp-count">${items.length}</span>`;
    head.querySelector('.tp-group-name').textContent = sec.name;
    head.onclick = () => {
      if (tpCollapsed.has(sec.key)) tpCollapsed.delete(sec.key); else tpCollapsed.add(sec.key);
      renderTaskPicker();
    };
    list.appendChild(head);

    if (!collapsed) items.forEach(t => addItem(t.name, t.id, t.color, sec.name));
  });

  if (!anyShown) {
    const empty = document.createElement('div');
    empty.className = 'tp-empty'; empty.textContent = 'Sin resultados. Puedes crear una tarea nueva arriba.';
    list.appendChild(empty);
  }
  onPopupTaskChange();
}

// Los textareas del nombre y la nota crecen con el texto (sin scroll ni recorte): se
// resetea la altura a "auto" para poder medir el contenido real y luego se fija a ese
// alto. Solo funciona si el elemento ya es VISIBLE (si no, scrollHeight sale 0), así que
// se llama siempre después de mostrar el popup, nunca antes.
function autoGrowTextarea(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function autoGrowPopupFields() {
  autoGrowTextarea(document.getElementById('popupTaskNameEdit'));
  autoGrowTextarea(document.getElementById('popupNote'));
}
document.getElementById('popupTaskNameEdit').addEventListener('input', (e) => autoGrowTextarea(e.target));
document.getElementById('popupNote').addEventListener('input', (e) => autoGrowTextarea(e.target));


function updatePopupTaskMemo(task) {
  const row = document.getElementById('popupTaskMemo');
  const txt = document.getElementById('popupTaskMemoText');
  if (!row || !txt) return;
  const memo = task && (task.memo || '').trim();
  if (memo) {
    txt.textContent = memo;
    row.style.display = 'flex';
    row.classList.add('visible');
  } else {
    txt.textContent = '';
    row.style.display = 'none';
    row.classList.remove('visible');
  }
}

function openEditPopup(task, entryIndex, entry, ancla) {
  quitarBorrador();
  popupMode = 'edit';
  popupCtx = { task, entryIndex, date: startOfDay(new Date(entry.start)) };
  if (!ancla || !ancla.isConnected) ancla = bloqueDe(task.id, entry.start);
  if (ancla) calDnD.markSelected(ancla, task.id, entry.start);
  const entryName = entry.nameAtTime || task.name;
  // El nombre que se edita aquí es el de ESTA entrada (como la nota): corrige cómo
  // quedó registrada, sin tocar la tarea ni el resto de su historial. Para cambiar
  // el nombre de la tarea de cara al futuro, se hace desde el panel principal (doble
  // clic). Si la tarea está borrada, tampoco se puede editar (ni "revivirla" con los
  // controles rápidos): se deja el nombre como título fijo, tal cual quedó registrado.
  const nameInput = document.getElementById('popupTaskNameEdit');
  if (task.deleted) {
    document.getElementById('popupTitle').textContent = entryName + ' (eliminada)';
    document.getElementById('popupTitle').style.display = '';
    nameInput.style.display = 'none';
  } else {
    document.getElementById('popupTitle').style.display = 'none';
    nameInput.style.display = '';
    nameInput.value = entryName;
  }
  document.getElementById('popupDeleteBtn').style.display = '';

  document.getElementById('entryPopup').classList.remove('wide');
  document.getElementById('popupTaskPicker').style.display = 'none';
  document.getElementById('popupNewTaskFields').style.display = 'none';

  const s = new Date(entry.start);
  document.getElementById('popupStart').value = `${pad2(s.getHours())}:${pad2(s.getMinutes())}`;
  if (entry.end) {
    const e = new Date(entry.end);
    document.getElementById('popupEnd').value = `${pad2(e.getHours())}:${pad2(e.getMinutes())}`;
  } else {
    document.getElementById('popupEnd').value = '';
  }
  document.getElementById('popupNote').value = entry.note || '';
  updatePopupTaskMemo(task);
  renderPopupSubtasks(task, entry);
  renderPopupQuickActions(task, entryIndex, entry);
  pintarCabeceraPopup(task, entry, popupCtx.date);
  showPopup(ancla);
}

// Cabecera del bocadillo: el punto de color de la tarea y, debajo del nombre, qué día es y
// cuánto dura.
function pintarCabeceraPopup(task, entry, date, lo, hi) {
  const dot = document.getElementById('popupDot');
  const meta = document.getElementById('popupMeta');
  const d = startOfDay(date);
  const dia = `${DOW_LONG[(d.getDay() + 6) % 7]} ${d.getDate()} de ${MONTHS[d.getMonth()].toLowerCase()}`;
  if (task && entry) {
    dot.style.setProperty('--c', task.color);
    const dur = formatDur((entry.end || Date.now()) - entry.start);
    meta.textContent = `${dia} · ${dur}${entry.end == null ? ' · en curso' : ''}`;
  } else {
    const t = (currentState.tasks || []).find(x => x.id === popupSelectedTaskId);
    dot.style.setProperty('--c', t ? t.color : 'var(--accent2)');
    meta.textContent = lo != null ? `${dia} · ${formatDur((hi - lo) * 3600000)}` : dia;
  }
}

// ---------- Subtarea de la entrada ----------
// Desde aquí se corrige a qué parte de la tarea fue este rato, y se pueden crear,
// renombrar o borrar subtareas sin salir del calendario. Igual que el nombre y la
// nota, el cambio es de ESTA entrada: no toca el resto del historial.
let popupSubId = null;

// Sello de la lista de subtareas que hay pintada, para no rehacerla si no ha cambiado.
function firmaSubtareas(task, entry) {
  return (task.subtasks || []).map(x => x.id + ':' + x.name).join('|')
    + '§' + (entry.subId || '') + '§' + (entry.subNameAtTime || '');
}

function renderPopupSubtasks(task, entry) {
  const fila = document.getElementById('popupSubRow');
  // En una tarea eliminada el registro se mira, no se toca.
  if (task.deleted) { fila.style.display = 'none'; return; }
  fila.style.display = 'flex';

  popupSubId = entry.subId || '';
  const sel = document.getElementById('popupSubSelect');
  sel.innerHTML = '';
  const ninguna = document.createElement('option');
  ninguna.value = '';
  ninguna.textContent = 'Sin subtarea';
  sel.appendChild(ninguna);
  (task.subtasks || []).forEach(sub => {
    const opt = document.createElement('option');
    opt.value = sub.id;
    opt.textContent = sub.name;
    sel.appendChild(opt);
  });
  // La entrada puede apuntar a una subtarea ya borrada: se enseña como estaba, para
  // no cambiarle el registro por el simple hecho de abrir el popup.
  if (popupSubId && !(task.subtasks || []).some(x => x.id === popupSubId)) {
    const opt = document.createElement('option');
    opt.value = popupSubId;
    opt.textContent = (entry.subNameAtTime || 'subtarea') + ' (eliminada)';
    sel.appendChild(opt);
  }
  sel.value = popupSubId;
  sel.dataset.firma = firmaSubtareas(task, entry);
  actualizarBotonesSub(task);

  sel.onchange = () => { popupSubId = sel.value; actualizarBotonesSub(task); };

  document.getElementById('popupSubAdd').onclick = async () => {
    const nombre = await askText({
      title: 'Nueva subtarea',
      text: `Se creará dentro de "${task.name}".`,
      placeholder: 'Nombre de la subtarea',
      okLabel: 'Crear', maxLength: 120,
    });
    if (nombre === null) return;
    const n = nombre.trim();
    if (!n) return;
    // El id lo pone el proceso principal; se recupera del siguiente estado por nombre.
    subEsperando = { taskId: task.id, name: n };
    ipcRenderer.send('action', { type:'add-subtask', payload:{ taskId: task.id, name: n } });
  };

  document.getElementById('popupSubEdit').onclick = async () => {
    const sub = (task.subtasks || []).find(x => x.id === popupSubId);
    if (!sub) return;
    const nombre = await askText({ title: 'Cambiar el nombre', value: sub.name, maxLength: 120 });
    if (nombre === null) return;
    const n = nombre.trim();
    if (!n || n === sub.name) return;
    ipcRenderer.send('action', { type:'rename-subtask', payload:{ taskId: task.id, subId: sub.id, name: n } });
  };

  document.getElementById('popupSubDel').onclick = () => {
    const sub = (task.subtasks || []).find(x => x.id === popupSubId);
    if (!sub) return;
    showConfirmPopup(
      'Eliminar subtarea',
      `Se quita "${sub.name}" de la lista de "${task.name}". El tiempo que ya lleva NO se pierde: sigue contando en la tarea y los ratos ya hechos se siguen viendo aquí con su nombre.`,
      'Eliminar',
      () => {
        popupSubId = '';
        ipcRenderer.send('action', { type:'delete-subtask', payload:{ taskId: task.id, subId: sub.id } });
      });
  };
}

// Vuelve a pintar la fila con la lista de subtareas recien llegada, conservando la
// eleccion actual (o estrenando la que se acaba de crear).
function refrescarFilaSubtarea() {
  if (popupMode !== 'edit' || !popupCtx || !currentState) return;
  const task = currentState.tasks.find(t => t.id === popupCtx.task.id);
  if (!task) return;
  popupCtx.task = task;                       // el popup trabaja con el estado vivo
  const entry = task.entries[popupCtx.entryIndex];
  if (!entry) return;

  const sel0 = document.getElementById('popupSubSelect');

  // El estado llega cada segundo, y aquí se rehacían las opciones del desplegable cada
  // vez. Si lo tenías abierto, el navegador lo cerraba al destruirlas: parecía que se
  // plegaba solo al segundo. Solo se rehace si de verdad ha cambiado la lista.
  const firma = firmaSubtareas(task, entry);
  const esperandoNueva = !!subEsperando;
  if (!esperandoNueva && sel0 && firma === sel0.dataset.firma) { actualizarBotonesSub(task); return; }

  // Y aunque haya cambiado: si lo estás usando ahora mismo, se deja en paz. Lo nuevo
  // entrará la próxima vez que lo abras.
  if (sel0 && document.activeElement === sel0) return;

  const elegida = popupSubId;
  renderPopupSubtasks(task, entry);


  // Si acabamos de crear una, se selecciona ella; si no, se respeta lo que hubiera.
  const nueva = subEsperando && (task.subtasks || []).find(x => x.name === subEsperando.name);
  const objetivo = nueva ? nueva.id : elegida;
  if (nueva) subEsperando = null;
  const sel = document.getElementById('popupSubSelect');
  if (sel && objetivo && Array.from(sel.options).some(o => o.value === objetivo)) {
    sel.value = objetivo;
    popupSubId = objetivo;
  }
  actualizarBotonesSub(task);
}

function actualizarBotonesSub(task) {
  const hay = !!popupSubId && (task.subtasks || []).some(x => x.id === popupSubId);
  document.getElementById('popupSubEdit').disabled = !hay;
  document.getElementById('popupSubDel').disabled = !hay;
}

// Nombre de la subtarea recien pedida, para reconocerla cuando llegue el estado nuevo
// (el id lo pone el proceso principal).
let subEsperando = null;

// ---------- Popup de confirmación (con el estilo de la app, no confirm() nativo) ----------
function showConfirmPopup(title, text, okLabel, onConfirm) {
  document.getElementById('confirmPopupTitle').textContent = title;
  document.getElementById('confirmPopupText').textContent = text;
  const okBtn = document.getElementById('confirmPopupOkBtn');
  okBtn.textContent = okLabel || 'Confirmar';
  okBtn.onclick = () => { closeConfirmPopup(); onConfirm(); };
  document.getElementById('confirmPopupCancelBtn').style.display = '';
  document.getElementById('confirmPopupBackdrop').style.display = 'block';
  document.getElementById('confirmPopup').style.display = 'flex';
}
// Lo mismo para avisos (en vez del alert() nativo): un solo botón, y no hay nada que confirmar.
function showAlertPopup(text, title) {
  showConfirmPopup(title || 'Aviso', text, 'Entendido', () => {});
  document.getElementById('confirmPopupCancelBtn').style.display = 'none';
}
function closeConfirmPopup() {
  document.getElementById('confirmPopupBackdrop').style.display = 'none';
  document.getElementById('confirmPopup').style.display = 'none';
}

const PQA_ICON_PAUSE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>`;
const PQA_ICON_RESTART = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;
const PQA_ICON_PLAY = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9V3z"/></svg>`;
const PQA_ICON_EXTEND = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const PQA_ICON_UNDO = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>`;

// Controles rápidos según de qué entrada se trate: si es la que está corriendo ahora
// mismo, pausar o partirla con una nota distinta; si ya está cerrada y la tarea no
// está en marcha, poder reanudarla (como una entrada nueva desde ahora, o alargando
// esta misma hasta ahora, tal cual estuviera en marcha desde su hora de inicio).
function renderPopupQuickActions(task, entryIndex, entry) {
  const wrap = document.getElementById('popupQuickActions');
  wrap.innerHTML = '';

  const mkBtn = (icon, label, colorClass, onClick) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pqa-btn ' + colorClass;
    b.innerHTML = icon + `<span>${label}</span>`;
    b.onclick = onClick;
    return b;
  };

  // Tarea borrada: desde aquí se puede restaurar (vuelve al panel principal). Es el
  // "restaurar desde el calendario" para cuando ya caducó en la papelera.
  if (task.deleted) {
    const label = document.createElement('span');
    label.className = 'pqa-label';
    label.textContent = 'Esta tarea está eliminada:';
    wrap.appendChild(label);
    wrap.appendChild(mkBtn(PQA_ICON_UNDO, 'Restaurar tarea', 'pqa-success', () => {
      ipcRenderer.send('action', { type:'restore-task', payload:{ taskId: task.id } });
      closePopup();
    }));
    return;
  }

  const isLiveEntry = entry.end == null;
  const taskIsActive = currentState && task.id === currentState.activeTaskId;

  if (isLiveEntry && taskIsActive) {
    wrap.appendChild(mkBtn(PQA_ICON_PAUSE, 'Pausar', 'pqa-danger', () => {
      ipcRenderer.send('action', { type:'pause' }); closePopup();
    }));
    wrap.appendChild(mkBtn(PQA_ICON_RESTART, 'Reiniciar con otra nota', 'pqa-accent', () => {
      askText({
        title: 'Reiniciar con otra nota',
        text: 'Se cierra este rato y empieza uno nuevo desde ahora, en la misma tarea.',
        placeholder: 'Nota para la nueva sesión (opcional)',
        okLabel: 'Reiniciar', maxLength: 500,
      }).then(note => {
        if (note === null) return;
        ipcRenderer.send('action', { type:'restart-task-with-note', payload:{ note } });
        closePopup();
      });
    }));
  } else if (taskIsActive) {
    // Entrada vieja de una tarea que ya corre en otro rato. Antes aquí no salía nada, y
    // como depende de qué tarea esté activa, parecía que los botones iban y venían.
    // No se ofrece "alargar": reabrir este rato hasta ahora se solaparía con el que está
    // en marcha, y el calendario acabaría con dos bloques pisándose.
    const label = document.createElement('span');
    label.className = 'pqa-label';
    label.textContent = 'Esta tarea ya está en marcha:';
    wrap.appendChild(label);
    wrap.appendChild(mkBtn(PQA_ICON_PAUSE, 'Pausar la tarea', 'pqa-danger', () => {
      ipcRenderer.send('action', { type:'pause' }); closePopup();
    }));
    wrap.appendChild(mkBtn(PQA_ICON_RESTART, 'Cortar y empezar un rato nuevo', 'pqa-accent', () => {
      askText({
        title: 'Empezar un rato nuevo',
        text: 'Se cierra el rato que está corriendo ahora y empieza otro desde este momento, en la misma tarea.',
        placeholder: 'Nota para la nueva sesión (opcional)',
        okLabel: 'Empezar', maxLength: 500,
      }).then(note => {
        if (note === null) return;
        ipcRenderer.send('action', { type:'restart-task-with-note', payload:{ note } });
        closePopup();
      });
    }));
  } else {
    const label = document.createElement('span');
    label.className = 'pqa-label';
    label.textContent = 'Reanudar esta tarea:';
    wrap.appendChild(label);
    wrap.appendChild(mkBtn(PQA_ICON_PLAY, 'Nueva entrada desde ahora', 'pqa-success', () => {
      // Se reanuda en la misma subtarea en la que estaba, si la entrada era de una y
      // esa subtarea sigue existiendo.
      const sub = entry.subId && (task.subtasks || []).some(x => x.id === entry.subId) ? entry.subId : undefined;
      // Se continúa con lo mismo: misma subtarea y misma nota que este rato.
      ipcRenderer.send('action', { type:'switch-task', payload:{ taskId: task.id, subId: sub, note: entry.note } });
      closePopup();
    }));
    wrap.appendChild(mkBtn(PQA_ICON_EXTEND, 'Alargar esta hasta ahora', 'pqa-accent', () => {
      showConfirmPopup(
        'Alargar entrada',
        'Esto alargará esta entrada (desde su hora de inicio original) hasta ahora mismo, en vez de crear una nueva.',
        'Alargar',
        () => { ipcRenderer.send('action', { type:'resume-entry', payload:{ taskId: task.id, entryIndex } }); closePopup(); }
      );
    }));
  }
}

function onPopupTaskChange() {
  const isNew = popupSelectedTaskId === '__new__';
  document.getElementById('popupNewTaskFields').style.display = isNew ? 'flex' : 'none';
  const manualColors = currentState.settings && currentState.settings.colorMode === 'manual';
  document.getElementById('popupColorSection').style.display = manualColors ? '' : 'none';
  // El borrador de la rejilla y el punto de la cabecera toman el color de la tarea elegida.
  if (popupMode === 'create' && borrador) {
    pintarCabeceraPopup(null, null, borrador.date, borrador.lo, borrador.hi);
    pintarBorrador();
  }
}

// La tarea nueva puede nacer ya dentro de una sección, igual que desde "Empezar una
// tarea ahora": sin esto, siempre salía suelta y había que ir luego a Tareas a moverla.
function poblarPopupNewTaskSection() {
  const sel = document.getElementById('popupNewTaskSection');
  const prev = sel.value;
  sel.innerHTML = '';
  const ninguna = document.createElement('option');
  ninguna.value = '';
  ninguna.textContent = 'Sin sección';
  sel.appendChild(ninguna);
  ((currentState && currentState.groups) || []).forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.name;
    sel.appendChild(opt);
  });
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function buildPopupColorPicker() {
  const cp = document.getElementById('popupColorPicker');
  cp.innerHTML = '';
  popupColor = COLORS[0];
  COLORS.forEach((c,i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (i===0?' selected':'');
    sw.style.background = c;
    sw.onclick = () => { cp.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected')); sw.classList.add('selected'); popupColor = c; };
    cp.appendChild(sw);
  });
}

// ---------- Bocadillo anclado (2.8) ----------
// El popup de una entrada ya no sale en el centro tapándolo todo: sale al lado de su
// bloque (o del borrador, si es nueva), con una gotita que le apunta y cristal líquido de
// fondo (ver bocadillo.js).
const bocadilloEntrada = Bocadillo.crear(document.getElementById('entryPopup'));

function showPopup(ancla, alMostrar) {
  document.getElementById('popupBackdrop').style.display = 'block';
  const pop = document.getElementById('entryPopup');
  // Los textos que crecen solos se miden antes de colocarlo (si no, el cristal se queda
  // corto): para medir tiene que estar ya maquetado, aunque todavía invisible.
  pop.classList.add('pop', 'preparando');
  pop.style.display = 'flex';
  autoGrowPopupFields();
  bocadilloEntrada.abrir(ancla, alMostrar);
}

// La gotita sigue al borrador cuando cambian las horas (el bocadillo no se mueve).
function reapuntarPopup(ancla) { bocadilloEntrada.reapuntar(ancla); }

function closePopup() {
  document.getElementById('popupBackdrop').style.display = 'none';
  bocadilloEntrada.cerrar();
  popupMode = null; popupCtx = null;
  quitarBorrador();
  // El popup tapaba el bloque bajo el ratón: al cerrarse, el navegador tarda en darse
  // cuenta de que ya no está "encima" de nada, así que el próximo refresco no debe
  // saltarse por eso (si no, al borrar/editar una entrada no desaparecía/actualizaba
  // hasta cambiar de ventana y volver).
  forceNextRenderWeek = true;
}

function savePopup() {
  const startVal = document.getElementById('popupStart').value;
  const endVal = document.getElementById('popupEnd').value;
  if (!startVal) { showAlertPopup('Indica una hora de inicio'); return; }
  const day = startOfDay(popupCtx.date);
  const startMs = day.getTime() + hhmmToHour(startVal)*3600000;
  const endMs = endVal ? day.getTime() + hhmmToHour(endVal)*3600000 : null;
  if (endMs !== null && endMs <= startMs) { showAlertPopup('La hora de fin debe ser posterior al inicio'); return; }
  const note = document.getElementById('popupNote').value.trim();

  if (popupMode === 'create') {
    if (popupSelectedTaskId === '__new__' || !popupSelectedTaskId) {
      const name = document.getElementById('popupNewTaskName').value.trim();
      if (!name) { showAlertPopup('Ponle un nombre a la tarea'); return; }
      const newTaskGroupId = document.getElementById('popupNewTaskSection').value || undefined;
      ipcRenderer.send('action', { type:'add-calendar-entry', payload:{ taskId:null, newTaskName:name, newTaskColor:popupColor, newTaskGroupId, startMs, endMs, note } });
    } else {
      ipcRenderer.send('action', { type:'add-calendar-entry', payload:{ taskId:popupSelectedTaskId, startMs, endMs, note } });
    }
  } else if (popupMode === 'edit') {
    // El nombre que se manda aquí es solo de ESTA entrada (entry.nameAtTime): no
    // renombra la tarea ni afecta a otras veces que se haya hecho. El de la tarea
    // en sí se cambia desde el panel principal (doble clic).
    const name = popupCtx.task.deleted ? undefined : document.getElementById('popupTaskNameEdit').value.trim();
    // subId va siempre (aunque sea ''): quitarle la subtarea a una entrada es un cambio
    // tan válido como ponérsela, y con undefined el proceso principal lo ignoraría.
    const subId = popupCtx.task.deleted ? undefined : (popupSubId || '');
    ipcRenderer.send('action', { type:'edit-entry', payload:{ taskId:popupCtx.task.id, entryIndex:popupCtx.entryIndex, startMs, endMs, note, name, subId } });
  }
  closePopup();
}

function deletePopupEntry() {
  if (popupMode !== 'edit') return;
  ipcRenderer.send('action', { type:'delete-entry', payload:{ taskId:popupCtx.task.id, entryIndex:popupCtx.entryIndex } });
  closePopup();
}

// ---------- Week nav ----------
function prevWeek() { viewWeekStart = addDays(viewWeekStart,-7); renderWeek(); renderMiniCal(); }
function nextWeek() { viewWeekStart = addDays(viewWeekStart,7); renderWeek(); renderMiniCal(); }

// ---------- Export ----------
// Al pulsar "Exportar CSV" se abre un popup para elegir QUÉ días exportar; luego
// un diálogo nativo "Guardar como…" (en main.js) para elegir DÓNDE guardarlo.
function exportCSV() { openExportPopup(); }

function openExportPopup() {
  if (!currentState) return;
  const dk = dateKey(startOfDay(selectedDate || today0));
  document.getElementById('exportFrom').value = dk;
  document.getElementById('exportTo').value = dk;
  document.querySelector('input[name="exportRange"][value="all"]').checked = true;
  updateExportHint();
  document.getElementById('exportPopupBackdrop').style.display = 'block';
  document.getElementById('exportPopup').style.display = 'flex';
}
function closeExportPopup() {
  document.getElementById('exportPopupBackdrop').style.display = 'none';
  document.getElementById('exportPopup').style.display = 'none';
}

// Devuelve { fromMs, toMsExcl, label } según la opción elegida, o null si es inválida.
function currentExportRange() {
  const val = document.querySelector('input[name="exportRange"]:checked').value;
  if (val === 'all')  return { fromMs: 0, toMsExcl: Infinity, label: 'todos' };
  if (val === 'week') { const f = startOfDay(viewWeekStart).getTime(); return { fromMs: f, toMsExcl: f + 7*86400000, label: 'semana' }; }
  if (val === 'day')  { const d = startOfDay(selectedDate || today0).getTime(); return { fromMs: d, toMsExcl: d + 86400000, label: 'dia' }; }
  const fromV = document.getElementById('exportFrom').value;
  const toV = document.getElementById('exportTo').value;
  if (!fromV || !toV) return null;
  const fromMs = startOfDay(new Date(fromV + 'T00:00:00')).getTime();
  const toMsExcl = startOfDay(new Date(toV + 'T00:00:00')).getTime() + 86400000;
  if (!(toMsExcl > fromMs)) return null;
  return { fromMs, toMsExcl, label: 'rango' };
}

function updateExportHint() {
  const val = document.querySelector('input[name="exportRange"]:checked').value;
  document.getElementById('exportCustomRow').style.display = val === 'custom' ? 'flex' : 'none';
  const hint = document.getElementById('exportHint');
  const r = currentExportRange();
  if (val === 'all') { hint.textContent = 'Se exportarán todos los días con actividad registrada.'; return; }
  if (!r) { hint.textContent = 'Elige las fechas de inicio y fin.'; return; }
  const fromD = new Date(r.fromMs), toD = new Date(r.toMsExcl - 86400000);
  const f = `${pad2(fromD.getDate())}/${pad2(fromD.getMonth()+1)}/${fromD.getFullYear()}`;
  const t = `${pad2(toD.getDate())}/${pad2(toD.getMonth()+1)}/${toD.getFullYear()}`;
  hint.textContent = f === t ? `Día ${f}.` : `Del ${f} al ${t}.`;
}

function buildCSV(fromMs, toMsExcl) {
  const rows = ['Fecha,Tarea,Segundos,Horas'];
  const map = {};
  const names = {};   // nombre a mostrar por cada agrupación (el nameAtTime de la entrada)
  currentState.tasks.forEach(task => {
    task.entries.forEach(entry => {
      const entryName = (entry.nameAtTime || task.name) +
        (entry.subNameAtTime ? ` · ${entry.subNameAtTime}` : '');
      let cur = startOfDay(new Date(entry.start));
      const end = startOfDay(new Date(entry.end || Date.now()));
      while (cur <= end) {
        const dayStart = cur.getTime(), dayEnd = dayStart + 86400000;
        if (dayStart >= fromMs && dayStart < toMsExcl) {
          const from = Math.max(entry.start, dayStart), to = Math.min(entry.end || Date.now(), dayEnd);
          const secs = Math.max(0, Math.floor((to - from) / 1000));
          if (secs > 0) {
            // Se agrupa por día + nombre registrado (no por id de tarea): así, si la tarea
            // se renombró, cada nombre sale en su propia fila, como se ve en el calendario.
            const key = dateKey(cur) + '|' + entryName;
            map[key] = (map[key] || 0) + secs;
            names[key] = entryName;
          }
        }
        cur = addDays(cur, 1);
      }
    });
  });
  Object.entries(map).sort().forEach(([key, secs]) => {
    const day = key.split('|')[0];
    const name = (names[key] || '').replace(/"/g, '""');
    rows.push(`${day},"${name}",${secs},${(secs/3600).toFixed(2)}`);
  });
  return rows.join('\n');
}

function exportFileName(r) {
  if (r.label === 'todos')  return 'imputa-horas-todos.csv';
  if (r.label === 'semana') return 'imputa-horas-semana.csv';
  if (r.label === 'dia')    return `imputa-horas-${dateKey(new Date(r.fromMs))}.csv`;
  return `imputa-horas-${dateKey(new Date(r.fromMs))}_a_${dateKey(new Date(r.toMsExcl - 86400000))}.csv`;
}

async function confirmExport() {
  if (!currentState) return;
  const r = currentExportRange();
  if (!r) { showAlertPopup('Indica un rango de fechas válido.'); return; }
  const content = buildCSV(r.fromMs, r.toMsExcl);
  if (content.split('\n').length <= 1) { showAlertPopup('No hay actividad registrada en el rango elegido.'); return; }
  const btn = document.getElementById('exportConfirmBtn');
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const res = await ipcRenderer.invoke('export-csv', { content, defaultName: exportFileName(r) });
    if (res && res.ok) { closeExportPopup(); shell.openPath(res.path); }
    else if (!(res && res.canceled)) { showAlertPopup('No se pudo exportar: ' + ((res && res.error) || 'error desconocido')); }
  } catch (e) {
    showAlertPopup('No se pudo exportar: ' + (e.message || e));
  }
  btn.disabled = false; btn.textContent = prev;
}

function closeWin() { ipcRenderer.send('action', { type:'close-calendar' }); }

setInterval(() => { if (currentState) renderWeek(); }, 60000);
</script>
